<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component Studio</title>
<style>
:root{
  --bg:#FBFBFC;
  --panel:#FFFFFF;
  --line:#E8E9EE;
  --line-2:#F0F1F5;
  --text:#14161C;
  --text-2:#4B5162;
  --muted:#8A90A0;
  --accent:#5464F2;
  --accent-bg:#EEF0FE;
  --accent-line:#C9CFFB;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#D7D9E2;border-radius:9px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#C2C5D2;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex;flex-direction:column}

/* ---------------- top bar ---------------- */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.015em}
.logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
  background:linear-gradient(140deg,#6C7BFF,#4A5AEE);box-shadow:0 2px 6px rgba(84,100,242,.32)}
.divider{width:1px;height:22px;background:var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--text-2);font-weight:520}
.crumbs .sep{color:#C3C7D3;display:flex}
.crumbs .cur{color:var(--accent);font-weight:640}
.spacer{flex:1}
.tbtn{height:31px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--text-2);
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.14s;font-size:12.5px;font-weight:540}
.tbtn:hover{background:#F7F8FA;border-color:#DCDEE7;color:var(--text)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{background:#4351E8;border-color:#4351E8}

.body{flex:1;display:flex;min-height:0}

/* ---------------- library rail ---------------- */
.rail{width:286px;flex:0 0 286px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:22px;height:22px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:6px}
.icon-btn:hover{background:#F2F3F7;color:var(--text-2)}
.search{position:relative;padding:0 14px 12px}
.search svg{position:absolute;left:24px;top:9px;color:var(--muted)}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:#FBFBFD;padding:0 10px 0 32px;outline:0;transition:.14s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.12);background:#fff}
.rail-scroll{flex:1;overflow-y:auto;padding:0 10px 12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--text-2);
  transition:.12s;user-select:none;font-weight:540;font-size:13.5px;margin-bottom:2px}
.nav-item:hover{background:#F7F8FA}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:640;box-shadow:inset 0 0 0 1px var(--accent-line)}
.nav-item.locked{opacity:.55}
.nav-ico{width:18px;height:18px;display:grid;place-items:center;flex:0 0 18px}
.nav-dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.nav-tag{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--muted);background:#F4F5F8;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px}
.rail-foot{border-top:1px solid var(--line);padding:12px 18px;color:var(--muted);font-size:11px;line-height:1.65}
.rail-foot b{color:var(--text-2);font-weight:620}

/* ---------------- canvas ---------------- */
.canvas-wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:auto}
.canvas-inner{padding:26px 30px 60px;min-width:max-content}
.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.art-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.art-sub{color:var(--muted);font-size:13px;margin-top:3px}
.zoom{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{height:29px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--text-2);font-size:12px;font-weight:540;white-space:nowrap}
.seg{display:inline-flex;background:#EDEEF3;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:0 12px;height:25px;border-radius:7px;cursor:pointer;color:var(--text-2);
  font-size:12px;font-weight:560;transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(20,24,36,.14)}

.artboard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px 30px;display:inline-block;min-width:100%}
.artboard.dark{background:#181B23;border-color:#2A2F3C}
.artboard.dark .mx-col,.artboard.dark .mx-row-label{color:#8A90A0}
.artboard.dark .mx-row-label{color:#C9CDD8}

/* matrix */
.mx{display:grid;gap:0 16px;align-items:center}
.mx-col{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  text-align:center;padding:0 0 14px}
.mx-row-label{font-size:13px;font-weight:640;color:var(--text);white-space:nowrap;padding-right:14px}
.mx-cell{display:flex;align-items:center;justify-content:center;padding:9px 0;border-radius:9px;cursor:pointer;transition:.13s}
.mx-cell:hover{background:#F7F8FB}
.artboard.dark .mx-cell:hover{background:#20242E}
.mx-cell.on{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent-line)}
.mx-rowsep{grid-column:1/-1;height:1px;background:var(--line-2)}
.artboard.dark .mx-rowsep{background:#262B36}

/* single preview */
.stage{display:flex;align-items:center;justify-content:center;min-height:360px}
.frame{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.sel{position:absolute;inset:-1px;border:1px solid var(--accent);pointer-events:none}
.handle{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--accent);border-radius:1px}
.handle.tl{left:-4px;top:-4px}.handle.tr{right:-4px;top:-4px}.handle.bl{left:-4px;bottom:-4px}.handle.br{right:-4px;bottom:-4px}
.dim{position:absolute;left:50%;transform:translateX(-50%);bottom:-27px;background:var(--accent);color:#fff;font-size:11px;
  font-weight:640;padding:2px 7px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* groups + sizes */
.stack{display:flex;flex-direction:column;gap:14px}
.group-row{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:13px;background:#FCFCFD}
.group-head{display:flex;align-items:baseline;gap:10px}
.group-title{font-weight:660}
.group-use{font-size:11.5px;color:var(--muted)}
.group-btns{display:flex;gap:8px;flex-wrap:wrap}
.size-row{display:flex;gap:18px;flex-wrap:wrap}
.size-card{border:1px solid var(--line);border-radius:12px;padding:22px 26px 14px;display:flex;flex-direction:column;
  align-items:center;gap:14px;cursor:pointer;transition:.14s;background:#FCFCFD;min-width:170px}
.size-card:hover{border-color:#CFD3E6}
.size-card.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.11);background:#fff}
.size-meta{text-align:center}
.size-meta b{display:block;font-size:13px}
.size-meta span{font-size:11px;color:var(--muted)}

/* ---------------- inspector ---------------- */
.insp{width:392px;flex:0 0 392px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 24px}
.tabs button{flex:1;border:0;background:transparent;padding:15px 0 13px;cursor:pointer;color:var(--muted);font-weight:600;
  font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.14s}
.tabs button:hover{color:var(--text-2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.insp-scroll{flex:1;overflow-y:auto;padding:20px 24px 40px}
.grp{margin-bottom:26px}
.grp-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.grp-t .link{color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0}
.grp-t .link:hover{text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 13px;cursor:pointer;color:var(--text-2);
  font-size:12.5px;transition:.13s;font-weight:540;white-space:nowrap}
.pill:hover{border-color:#CFD3E6;background:#FAFAFC}
.pill.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:640}
.radios{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px 8px}
.radio{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-2);font-size:12.8px;user-select:none;white-space:nowrap}
.radio i{width:15px;height:15px;border-radius:50%;border:1.5px solid #C8CBD6;flex:0 0 15px;display:grid;place-items:center;transition:.14s}
.radio.on{color:var(--text);font-weight:560}
.radio.on i{border-color:var(--accent);border-width:4.5px}
.radio:hover i{border-color:#A9AEC0}
.radio.on:hover i{border-color:var(--accent)}

.tokens{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.3px}
.trow:nth-child(odd){background:#FAFAFC}
.trow .tk{color:var(--text-2);font-family:var(--mono);font-size:11.5px}
.trow .tv{font-weight:620;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;text-align:right}
.trow .tv.hex{color:var(--accent);font-family:var(--mono);font-size:11.5px}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.14);flex:0 0 11px}
.sw.grad{width:22px}
.tokchips{margin-top:10px}
.tok{display:inline-block;font-family:var(--mono);font-size:10.5px;background:#F6F7FA;border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;margin:0 5px 5px 0;color:var(--text-2)}

.callout{background:#FFF8E6;border:1px solid #F3DFA5;border-radius:10px;padding:12px 13px;display:flex;gap:10px;
  color:#8A6410;font-size:12.3px;font-style:italic;line-height:1.55}
.callout svg{flex:0 0 16px;margin-top:1px;color:#C48A16}
.callout.plain{font-style:normal}

pre.code{margin:0;background:#14161C;color:#D7DBE8;border-radius:10px;padding:14px;font-family:var(--mono);font-size:10.8px;
  line-height:1.65;overflow:auto;max-height:340px}
.code .c-p{color:#93A3FF}.code .c-v{color:#7FE3B1}.code .c-s{color:#5C6479}
.kv{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:5px 0;font-size:12.3px}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{color:var(--text);text-align:right;font-family:var(--mono);font-size:11.3px;word-break:break-word;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.doc ul{margin:0;padding-left:17px}
.doc li{margin:6px 0;color:var(--text-2);font-size:12.4px}
.doc li b{color:var(--text);font-weight:620}
.do li::marker{color:#16A34A}.dont li::marker{color:#EF4444}
.copy{border:1px solid var(--line);background:#FAFAFC;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:10.5px;
  color:var(--text-2);font-weight:660;letter-spacing:.04em;text-transform:uppercase}
.copy:hover{background:#fff;color:var(--text)}
.field{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:#FBFBFD;padding:0 10px;outline:0;transition:.13s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.12);background:#fff}
.rowsw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.rowsw label{color:var(--text-2);font-size:12.8px}
.tog{width:36px;height:21px;border-radius:20px;background:#DFE1EA;position:relative;cursor:pointer;transition:.16s;flex:0 0 36px}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.22)}
.tog.on{background:var(--accent)}.tog.on::after{transform:translateX(15px)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,18,28,.44);display:none;z-index:80;backdrop-filter:blur(3px)}
.modal.on{display:grid;place-items:center}
.sheet{width:min(900px,92vw);height:min(80vh,780px);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 26px 70px -20px rgba(10,14,26,.5)}
.sheet-head{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
.sheet-body{flex:1;overflow:auto;padding:18px;background:#FBFBFD}
.sheet-body pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.62;color:var(--text-2);white-space:pre-wrap}

/* rendered component */
.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  font-family:"Zoho Puvi","Inter",-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;user-select:none;cursor:pointer;
  overflow:hidden;position:relative;border-style:solid;transition:background .12s linear,border-color .12s linear}
.btn.no-int{cursor:default}
.btn[data-state="disabled"]{cursor:not-allowed}
.spin{border-radius:50%;border-style:solid;border-color:currentColor;border-top-color:transparent!important;animation:sp .7s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.lnk{font-family:"Zoho Puvi","Inter",-apple-system,sans-serif;font-size:14px;font-weight:500;cursor:pointer}
</style>
</head>

<div class="app">

  <header class="topbar">
    <div class="brand"><span class="logo">C</span><span>Component Spec</span></div>
    <div class="divider"></div>

    <div class="spacer"></div>
    <button class="tbtn" id="btnSource">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Markdown

  <div class="body">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></svg>
        </button>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="findInput" placeholder="Find components...">

          <div>
            <div class="art-title" id="artTitle">Button Artboard</div>

              <button data-bg="light" class="on">Light</button>

<script type="text/plain" id="md-Buttons"># Buttons
> Category: Components / Atoms > Version: v2.0.0

Buttons allow users to take actions, and make choices, with a single tap. They communicate actions and are typically placed throughout your UI in places like dialogs, forms, toolbars, and cards.

---

## Anatomy

The visual breakdown and structure of the standard CRM Button component, with full color token references per layer.

### Container Layer

| Part | Description |
|---|---|
| Type | Frame with Horizontal Auto Layout |
| Corner Radius | 6px (Default), 4px (Small, Extreme Small) |
| Border | 0px (filled/ghost buttons), 1px (outline/default buttons) |
| Height | 32px (Default), 27px (Small), 19px (Extreme Small) |
| Clip Content | Yes |

#### Container Background Colors

| Variant | Default | Hover | Click | Disabled |
|---|---|---|---|---|
| Primary | Gradient ↑ #124DC3 → #5767F6 (tokens 90298:926, 90298:925) | Gradient ↑ #0E3B98 → #3E4DEC (tokens 90298:961, 90298:960) | Solid #1344A9 (token 90298:962) | Solid #ADB3EE (token 90298:963) |
| Default | Gradient ↓ #FFFFFF → #F1F0F7 (tokens 90298:970, 90298:971) | Gradient ↓ #FFFFFF → #EAEBF5 (tokens 90298:980, 90298:981) | Solid #F0F1F8 (token 90298:991) | Solid #F7F7FB (token 90298:999) |
| Success | Gradient ↓ #11B670 → #0F935B (tokens 90298:1036, 90298:1037) | Gradient ↓ #13C177 → #0F9A5F (tokens 90298:1048, 90298:1049) | Solid #0F935B (token 90298:1053) | Solid #67CCA1 (token 90298:1057) |
| Negative | Gradient ↓ #FF4657 → #E23041 (tokens 90298:1011, 90298:1012) | Gradient ↓ #FC5060 → #D30B1E (tokens 90298:1020, 90298:1021) | Solid #D30B1E (token 90298:1025) | Solid #FFB1B8 (token 90298:1029) |
| Warning | Gradient ↓ #F5973A → #DB852F (tokens 90298:1065, 90298:1066) | Gradient ↓ #F5973A → #CF7D2B (tokens 90298:1067, 90298:1068) | Solid #CF7D2B (token 90298:1069) | Solid #EEBB8B (token 90298:1071) |
| Outline Blue | Solid #F0F1FF (token 90298:1110) | Solid #E5E8FF (token 90298:1112) | Solid #E5E8FF (token 90298:1112) | #F0F1FF opacity 0.6 (token 90298:1111) |
| Outline Green | Solid #E9FBF4 (token 90298:1114) | Solid #DCF7EB (token 90298:1115) | Solid #DCF7EB (token 90298:1115) | #E9FBF4 opacity 0.6 (token 90298:1117) |
| Outline Red | Solid #FFF2F3 (token 90298:1118) | Solid #FFE8EA (token 90298:1119) | Solid #FFE8EA (token 90298:1119) | #FFF2F3 opacity 0.5 (token 90298:1121) |
| Outline Orange | Solid #FFF9ED (token 90298:1124) | Solid #FEF2DA (token 90298:1125) | Solid #FEF2DA (token 90298:1126) | #FFF9ED opacity 0.6 (token 90298:1127) |
| Ghost Blue | Transparent | Solid #EEEFFF (token 90298:1122) | Solid #EEEFFF (token 90298:1122) | Transparent, opacity 0.6 |
| Ghost Red | Transparent | Solid #FFE8EA (token 90298:1123) | Solid #FFE8EA (token 90298:1123) | Transparent, opacity 0.6 |
| Zia (Filled) | Gradient → #1471D9 → #E21565 (tokens 90298:1357, 90298:1358) | — | — | — |
| Zia (Outline) | Gradient #EEF7FF → #FFEFF5 (tokens 90298:1361, 90298:1362) | — | — | — |

#### Container Border Colors

| Variant | Default | Hover | Click | Disabled |
|---|---|---|---|---|
| Primary | None (0px) | None | None | None |
| Default | 1px #D5D8E9 (token 90298:975) | 1px #D5D8E9 (token 90298:983) | 1px #D5D8E9 (token 90298:993) | 1px #D5D8E9 (token 90298:995) |
| Success | None (0px) | None | None | None |

## Usage Guidelines

### Do

1. Maintain clear hierarchy - Use one Primary action per screen space. Accompany with Default or Ghost buttons for secondary actions.
2. Use concise, active verbs - Label buttons with explicit CRM actions like "Create Lead", "Export CSV", or "Send Invite".
3. Always pair Primary with Default - Every Primary Button should have a Default "escape" nearby (Cancel, Close, Back).
4. Use Loading state for async - Always show Loading state during API calls, file uploads, and data processing.
5. Size consistency in groups - All buttons in the same row must use the same size tier.
6. Reference design tokens - Always use token IDs, never hardcode hex values.
7. Destructive actions need confirmation - Negative buttons should trigger a confirmation dialog.

### Don't

1. Avoid multiple competing primary actions - Multiple primary buttons side-by-side causes action confusion.
2. Avoid vague passive labels - Avoid "Click Here" or "Proceed". Use descriptive labels.
3. Don't use Negative for Cancel - Cancel is Default variant. Negative is ONLY for destructive actions.
4. Don't mix button sizes - Never combine 32px, 27px, and 19px in the same group.
5. Don't create custom colors - Only use approved variant tokens.
6. Don't use Extreme Small as primary CTA - 19px buttons for dense desktop UIs only.
7. Don't remove focus indicators - Keyboard accessibility requires visible focus rings.

function computeStyle(vid,sid,stateId,opts){

  const cols = (LINKS[0]||{states:[]}).states.map(s=>s.state);
  const mx=document.createElement('div'); mx.className='mx';
  mx.style.gridTemplateColumns='max-content repeat('+cols.length+', minmax(150px,1fr))';
  mx.appendChild(document.createElement('div'));
  cols.forEach(c=>{ const h=document.createElement('div'); h.className='mx-col'; h.textContent=c; mx.appendChild(h); });
  LINKS.forEach((L,i)=>{
    if(i){ const sep=document.createElement('div'); sep.className='mx-rowsep'; mx.appendChild(sep); }
    const lb=document.createElement('div'); lb.className='mx-row-label'; lb.textContent=L.name; mx.appendChild(lb);
    cols.forEach(c=>{
      const cell=document.createElement('div');
      cell.className='mx-cell'+(L.id===S.variant && norm(c)===norm(S.state)?' on':'');
      cell.appendChild(buildLink(L.id,c));
      cell.onclick=()=>{ S.variant=L.id; S.state=norm(c); renderAll(); };
      mx.appendChild(cell);
    });
  });
  art.appendChild(mx);
}

/* ---------- inspector ---------- */
function grp(t, inner, right){
  return '<div class="grp"><div class="grp-t"><span class="cap">'+t+'</span>'+(right||'')+'</div>'+inner+'</div>';
}
function swatchHTML(s){
  if(s.fill.type==='gradient') return '<span class="sw grad" style="background:'+s.fill.css+'"></span>';
  if(s.fill.type==='solid')    return '<span class="sw" style="background:'+s.fill.colors[0]+'"></span>';
  return '<span class="sw" style="background:repeating-linear-gradient(45deg,#EEE,#EEE 3px,#FFF 3px,#FFF 6px)"></span>';
}
function renderInspector(){
  const b=$('inspBody');
  if(S.component==='link') return renderLinkInspector(b);
  const v = VARIANTS.find(x=>x.id===S.variant)||VARIANTS[0];
  const s = computeStyle(S.variant,S.size,S.state,{chevron:S.chevron});

  if(S.tab==='design'){
    const fillVal = s.fill.type==='gradient'
      ? s.fill.colors[0]+' → '+s.fill.colors[1]
      : s.fill.type==='solid' ? s.fill.colors[0] : 'transparent';
    const rows = [
      ['bg-'+S.state, fillVal, swatchHTML(s), true],
      ['text-color', s.textColor, '<span class="sw" style="background:'+s.textColor+'"></span>', true],
      ['border', s.border.width? s.border.width+'px '+s.border.color : 'none',
        s.border.width?'<span class="sw" style="background:'+s.border.color+'"></span>':'', false],
      ['border-radius', s.radius+'px','',false],
      ['height', s.height+'px','',false],
      ['padding-x', s.padL+'px / '+s.padR+'px','',false],
      ['padding-y', s.padT+'px','',false],
      ['item-spacing', s.gap+'px','',false],
      ['font-size', s.font+'px','',false],
      ['font-weight', s.fontWeight,'',false],
      ['line-height', LABEL_FONT.lineHeight,'',false],
      ['font-family', s.fontFamily,'',false],
      ['icon-size', s.iconSize+'px','',false]
    ];
    const guide = guidanceFor(S.variant);
    b.innerHTML =
      grp('Variant Select','<div class="pills">'+VARIANTS.map(x=>'<span class="pill'+(x.id===S.variant?' on':'')+'" data-v="'+x.id+'">'+x.name+'</span>').join('')+'</div>') +
      grp('Interactive State','<div class="radios">'+STATES.map(x=>'<span class="radio'+(x.id===S.state?' on':'')+'" data-s="'+x.id+'"><i></i>'+x.name+'</span>').join('')+'</div>') +
      grp('Token Mapping','<div class="tokens">'+rows.map(r=>
          '<div class="trow"><span class="tk">'+r[0]+'</span><span class="tv'+(r[3]?' hex':'')+'">'+r[2]+r[1]+'</span></div>').join('')+'</div>' +
          (s.tokenIds.length?'<div class="tokchips">'+s.tokenIds.map(t=>'<span class="tok">'+t+'</span>').join('')+'</div>':''),
        '<span class="link" id="lnkTokens">View source</span>') +
      grp('Responsive Sizes','<div id="sizeStrip" class="size-row"></div>') +
      grp('Content',
        '<input class="field" id="inpLabel" placeholder="'+defaultLabel(S.variant)+'" value="'+(S.label==null?'':String(S.label).replace(/"/g,'&quot;'))+'">'+
        '<div class="rowsw"><label>Leading icon</label><div class="tog'+(S.icon?' on':'')+'" id="togIcon"></div></div>'+
        '<div class="rowsw"><label>Trailing chevron</label><div class="tog'+(S.chevron?' on':'')+'" id="togChev"></div></div>') +
      grp('Guidelines','<div class="callout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg><span>'+guide+'</span></div>') +
      (s.notes.length ? grp('Parser Notes', s.notes.map(n=>'<div class="callout plain">'+n+'</div>').join('')) : '');

    b.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{S.variant=e.dataset.v;S.label=null;renderAll();});
    b.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{S.state=e.dataset.s;renderAll();});
    $('inpLabel').oninput = e => { S.label = e.target.value===''?null:e.target.value; renderCanvas(); };
    $('togIcon').onclick = ()=>{ S.icon=!S.icon; renderAll(); };
    $('togChev').onclick = ()=>{ S.chevron=!S.chevron; renderAll(); };
    $('lnkTokens').onclick = openSource;
    const strip=$('sizeStrip');
    SIZES.slice().reverse().forEach(sz=>{
      const c=document.createElement('div'); c.className='size-card'+(sz.id===S.size?' on':'');
      c.style.cssText='min-width:0;flex:1;padding:16px 10px 10px;gap:11px';
      c.appendChild(buildButton(S.variant,sz.id,'default',{label:'Button'}));
      c.insertAdjacentHTML('beforeend','<div class="size-meta"><b>'+sz.short+'</b><span>'+sz.height+'h</span></div>');
      c.onclick=()=>{ S.size=sz.id; renderAll(); };
      strip.appendChild(c);
    });
    return;
  }

  /* ---- Inspect tab ---- */
  const sw = c => '<span class="sw" style="background:'+c+'"></span>';
  const fillTxt = s.fill.type==='gradient'
    ? swatchHTML(s)+s.fill.colors[0]+' → '+s.fill.colors[1]+' · '+s.fill.angle+'deg'
    : s.fill.type==='solid' ? sw(s.fill.colors[0])+s.fill.colors[0] : 'transparent';
  const vr = I.variants[S.variant], vh = T.variants?T.variants.headers:[];
  const doNode=section(DOC,'Do'), dontNode=section(DOC,"Don't");
  const numbered = n => (n?n.lines:[]).filter(l=>/^\s*\d+\.\s+/.test(l)).map(l=>l.replace(/^\s*\d+\.\s+/,''));
  const li = arr => '<ul>'+arr.map(x=>{ const m=/^([^-–—]+?)\s+[-–—]\s+(.*)$/.exec(x); return '<li>'+(m?'<b>'+m[1]+'</b> — '+m[2]:x)+'</li>'; }).join('')+'</ul>';

  b.innerHTML =
    grp('Computed · '+v.name+' · '+(STATES.find(x=>x.id===S.state)||{}).name,
      '<div class="kv"><span class="k">Fill</span><span class="v">'+fillTxt+'</span></div>'+
      '<div class="kv"><span class="k">Border</span><span class="v">'+(s.border.width?sw(s.border.color)+s.border.width+'px '+s.border.color+(s.border.opacity<1?' @'+s.border.opacity:''):'none')+'</span></div>'+
      '<div class="kv"><span class="k">Text</span><span class="v">'+sw(s.textColor)+s.textColor+(s.textAlpha<1?' @'+s.textAlpha:'')+'</span></div>'+
      (s.isLoader?'<div class="kv"><span class="k">Spinner</span><span class="v">'+sw(s.spinner)+s.spinner+'</span></div>':'')+
      (s.containerOpacity<1?'<div class="kv"><span class="k">Opacity</span><span class="v">'+s.containerOpacity+'</span></div>':'')+
      '<div class="kv"><span class="k">Typography</span><span class="v">'+s.fontFamily+' '+s.fontWeight+' '+s.font+'px</span></div>'+
      '<div class="kv"><span class="k">Focus ring</span><span class="v">'+FOCUS.width+'px '+FOCUS.color+' @'+FOCUS.offset+'px</span></div>') +
    grp('Raw markdown values',
      '<div class="kv"><span class="k">background</span><span class="v">'+esc(s.fill.raw)+'</span></div>'+
      '<div class="kv"><span class="k">border</span><span class="v">'+esc(s.border.raw||'None')+'</span></div>') +
    grp('Generated CSS','<pre class="code">'+cssFor(S.variant,S.size)+'</pre>','<button class="copy" id="copyIn">Copy</button>') +
    (vr ? grp('Usage',
      '<div class="kv"><span class="k">Emphasis</span><span class="v" style="font-family:var(--sans);font-size:12.2px">'+vr[vh[2]]+'</span></div>'+
      '<div class="kv"><span class="k">Fill type</span><span class="v">'+vr[vh[3]]+'</span></div>'+
      '<div class="kv"><span class="k">Border</span><span class="v">'+vr[vh[4]]+'</span></div>') : '') +
    grp('Do','<div class="doc do">'+li(numbered(doNode))+'</div>') +
    grp("Don't",'<div class="doc dont">'+li(numbered(dontNode))+'</div>') +
    (WARN.length ? grp('MD lint', WARN.map(w=>'<div class="callout plain"><span><b>'+w.raw+'</b> → '+w.fixed+' · '+w.why+'</span></div>').join('')) : '');
  const ci=$('copyIn'); if(ci) ci.onclick=copyCSS;
}
function guidanceFor(vid){
  const vr = I.variants[vid];
  const usage = vr ? vr[T.variants.headers[2]] : '';
  const doNode = section(DOC,'Do');
  const dos = (doNode?doNode.lines:[]).filter(l=>/^\s*\d+\.\s+/.test(l)).map(l=>l.replace(/^\s*\d+\.\s+/,''));
  let extra = '';
  if(vid==='primary')  extra = dos.find(d=>/hierarchy|Primary/i.test(d))||'';
  if(vid==='negative') extra = dos.find(d=>/Destructive/i.test(d))||'';
  if(/outline|ghost/.test(vid)) extra = dos.find(d=>/Always pair/i.test(d))||'';
  return usage + (extra? ' ' + extra : '');
}
function renderLinkInspector(b){
  const L = LINKS.find(l=>l.id===S.variant)||LINKS[0];
  if(!L){ b.innerHTML='<div class="callout plain">No Links section found in the markdown.</div>'; return; }
  b.innerHTML =
    grp('Variant Select','<div class="pills">'+LINKS.map(l=>'<span class="pill'+(l.id===S.variant?' on':'')+'" data-lv="'+l.id+'">'+l.name+'</span>').join('')+'</div>') +
    grp('Interactive State','<div class="radios">'+L.states.map(s=>'<span class="radio'+(norm(s.state)===S.state?' on':'')+'" data-ls="'+norm(s.state)+'"><i></i>'+s.state+'</span>').join('')+'</div>') +
    grp('Token Mapping','<div class="tokens">'+L.states.map(s=>
      '<div class="trow"><span class="tk">'+norm(s.state)+'</span><span class="tv hex"><span class="sw" style="background:'+(s.color.hex||'#000')+'"></span>'+(s.color.hex||'—')+'</span></div>'+
      '<div class="trow"><span class="tk">'+norm(s.state)+'-decoration</span><span class="tv">'+s.deco+'</span></div>').join('')+'</div>'+
      '<div class="tokchips">'+[...new Set(L.states.map(s=>s.token))].map(t=>'<span class="tok">'+t+'</span>').join('')+'</div>');
  b.querySelectorAll('[data-lv]').forEach(e=>e.onclick=()=>{S.variant=e.dataset.lv;renderAll();});
  b.querySelectorAll('[data-ls]').forEach(e=>e.onclick=()=>{S.state=e.dataset.ls;renderAll();});
}

/* ---------- CSS generation ---------- */
function cssFor(vid,sid){
  const v=VARIANTS.find(x=>x.id===vid);
  const cls='.btn--'+vid;
  const base=computeStyle(vid,sid,'default',{chevron:S.chevron});
  const L=[]; const P=(k,val)=>L.push('  <span class="c-p">'+k+'</span>: <span class="c-v">'+val+'</span>;');
  L.push('<span class="c-s">/* '+v.name+' · '+base.size.name+' · generated from '+META.name+'.md '+META.version+' */</span>');
  L.push(cls+' {');
  P('display','inline-flex'); P('align-items','center'); P('justify-content','center');
  P('height',base.height+'px');
  P('padding',base.padT+'px '+base.padR+'px '+base.padB+'px '+base.padL+'px');
  P('gap',base.gap+'px'); P('border-radius',base.radius+'px');
  P('border',base.border.width?base.border.width+'px solid '+base.border.color:'none');
  P('background',base.fill.css);
  P('color',rgba(base.textColor,base.textAlpha));
  P('font',base.fontWeight+' '+base.font+'px/1 "'+base.fontFamily+'", sans-serif');
  P('cursor','pointer');
  L.push('}');
  [['hover',':hover'],['click',':active'],['disabled','[disabled]']].forEach(([st,sel])=>{
    const c=computeStyle(vid,sid,st,{chevron:S.chevron});
    L.push(cls+sel+' {');
    P('background',c.fill.css);
    if(c.border.width) P('border-color',rgba(c.border.color,c.border.opacity==null?1:c.border.opacity));
    if(c.textAlpha<1) P('color',rgba(c.textColor,c.textAlpha));
    if(c.containerOpacity<1) P('opacity',c.containerOpacity);
    L.push('}');
  });
  const ld=computeStyle(vid,sid,'loader',{});
  L.push(cls+'.is-loading {');
  P('background',ld.fill.css);
  if(ld.border.width) P('border-color',ld.border.color);
  P('color','transparent');
  L.push('}');
  L.push(cls+'.is-loading::after {');
  P('content','""'); P('position','absolute');
  P('width',ld.iconSize+'px'); P('height',ld.iconSize+'px');
  P('border','2px solid '+ld.spinner); P('border-top-color','transparent');
  P('border-radius','50%'); P('animation','spin .7s linear infinite');
  L.push('}');
  L.push(cls+':focus-visible {');
  P('outline',FOCUS.width+'px solid '+FOCUS.color); P('outline-offset',FOCUS.offset+'px');
  L.push('}');
  return L.join('\n');
}
function plainCSS(){ return cssFor(S.variant,S.size).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&'); }
function copyCSS(){
  navigator.clipboard.writeText(plainCSS()).then(()=>{
    const b=$('btnCopyCss'); const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t,1200);
  });
}
function openSource(){ $('sheetPre').textContent=MD_SRC; $('sheetTitle').textContent=META.name+'.md'; $('modal').classList.add('on'); }

/* ---------- events ---------- */
$('tabs').querySelectorAll('button').forEach(t=>t.onclick=()=>{ S.tab=t.dataset.tab; renderAll(); });
$('bgSeg').querySelectorAll('button').forEach(t=>t.onclick=()=>{
  S.dark = t.dataset.bg==='dark';
  $('bgSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); renderCanvas();
});
$('btnCopyCss').onclick=copyCSS;
$('btnSource').onclick=openSource;
$('sheetClose').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{ if(e.target===$('modal')) $('modal').classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('modal').classList.remove('on'); });
$('findInput').oninput = e => { S.filter=e.target.value; renderNav(); };

function renderAll(){
  renderNav(); renderCrumbs(); renderModes(); renderCanvas();
  $('tabs').querySelectorAll('button').forEach(t=>t.classList.toggle('on',t.dataset.tab===S.tab));
  renderInspector();
}
renderAll();
console.log('[Component Studio] parsed', VARIANTS.length,'variants,',SIZES.length,'sizes,',LINKS.length,'link styles; warnings:',WARN);
</script>
