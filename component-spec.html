<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component Spec</title>
<style>
:root{
  --bg:#FBFBFC;
  --panel:#FFFFFF;
  --line:#E8E9EE;
  --line-2:#F0F1F5;
  --text:#14161C;
  --text-2:#4B5162;
  --muted:#8A90A0;
  --accent:#5464F2;
  --accent-bg:#EEF0FE;
  --accent-line:#C9CFFB;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#D7D9E2;border-radius:9px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#C2C5D2;background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex;flex-direction:column}

/* ---------------- top bar ---------------- */
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.015em}
.logo{
  width:27px;height:27px;display:block;object-fit:contain;flex:0 0 27px;
  background:none;border:0;border-radius:0;box-shadow:none;
}
.divider{width:1px;height:22px;background:var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--text-2);font-weight:520}
.crumbs .sep{color:#C3C7D3;display:flex}
.crumbs .cur{color:var(--accent);font-weight:640}
.spacer{flex:1}
.tbtn{height:31px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--text-2);
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.14s;font-size:12.5px;font-weight:540}
.tbtn:hover{background:#F7F8FA;border-color:#DCDEE7;color:var(--text)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{background:#4351E8;border-color:#4351E8}

.body{flex:1;display:flex;min-height:0}

/* ---------------- library rail ---------------- */
.rail{width:286px;flex:0 0 286px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:22px;height:22px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:6px}
.icon-btn:hover{background:#F2F3F7;color:var(--text-2)}
.search{position:relative;padding:0 14px 12px}
.search svg{position:absolute;left:24px;top:9px;color:var(--muted)}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:#FBFBFD;padding:0 10px 0 32px;outline:0;transition:.14s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.12);background:#fff}
.rail-scroll{flex:1;overflow-y:auto;padding:0 10px 12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--text-2);
  transition:.12s;user-select:none;font-weight:540;font-size:13.5px;margin-bottom:2px}
.nav-item:hover{background:#F7F8FA}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:640;box-shadow:inset 0 0 0 1px var(--accent-line)}
.nav-item.locked{opacity:.55}
.nav-ico{width:18px;height:18px;display:grid;place-items:center;flex:0 0 18px}
.nav-dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.nav-tag{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--muted);background:#F4F5F8;border:1px solid var(--line);
  border-radius:5px;padding:1px 5px}
.rail-foot{border-top:1px solid var(--line);padding:12px 18px;color:var(--muted);font-size:11px;line-height:1.65}
.rail-foot b{color:var(--text-2);font-weight:620}

/* ---------------- canvas ---------------- */
.canvas-wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:auto}
.canvas-inner{padding:26px 30px 60px;min-width:max-content}
.art-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.art-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
.art-sub{color:var(--muted);font-size:13px;margin-top:3px}
.zoom{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{height:29px;display:inline-flex;align-items:center;padding:0 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--text-2);font-size:12px;font-weight:540;white-space:nowrap}
.seg{display:inline-flex;background:#EDEEF3;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:0 12px;height:25px;border-radius:7px;cursor:pointer;color:var(--text-2);
  font-size:12px;font-weight:560;transition:.14s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(20,24,36,.14)}

.artboard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px 30px;display:inline-block;min-width:100%}
.artboard.dark{background:#181B23;border-color:#2A2F3C}
.artboard.dark .mx-col,.artboard.dark .mx-row-label{color:#8A90A0}
.artboard.dark .mx-row-label{color:#C9CDD8}

/* matrix */
.mx{display:grid;gap:0 16px;align-items:center}
.mx-col{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  text-align:center;padding:0 0 14px}
.mx-row-label{font-size:13px;font-weight:640;color:var(--text);white-space:nowrap;padding-right:14px}
.mx-cell{display:flex;align-items:center;justify-content:center;padding:12px 6px;border-radius:10px;
  cursor:pointer;transition:background .18s,box-shadow .18s}
.mx-cell:hover{background:linear-gradient(180deg,rgba(84,100,242,.055),rgba(84,100,242,.015))}
.artboard.dark .mx-cell:hover{background:linear-gradient(180deg,rgba(132,144,255,.12),rgba(132,144,255,.03))}
.mx-cell.on{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 3px rgba(84,100,242,.10)}
.mx-rowsep{grid-column:1/-1;height:1px;background:var(--line-2)}
.artboard.dark .mx-rowsep{background:#262B36}

/* single preview */
.stage{display:flex;align-items:center;justify-content:center;min-height:360px}
.frame{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.sel{position:absolute;inset:-1px;border:1px solid var(--accent);pointer-events:none}
.handle{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--accent);border-radius:1px}
.handle.tl{left:-4px;top:-4px}.handle.tr{right:-4px;top:-4px}.handle.bl{left:-4px;bottom:-4px}.handle.br{right:-4px;bottom:-4px}
.dim{position:absolute;left:50%;transform:translateX(-50%);bottom:-27px;background:var(--accent);color:#fff;font-size:11px;
  font-weight:640;padding:2px 7px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* groups + sizes */
.stack{display:flex;flex-direction:column;gap:14px}
.group-row{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:13px;background:#FCFCFD}
.group-head{display:flex;align-items:baseline;gap:10px}
.group-title{font-weight:660}
.group-use{font-size:11.5px;color:var(--muted)}
.group-btns{display:flex;gap:8px;flex-wrap:wrap}
.size-row{display:flex;gap:18px;flex-wrap:wrap}
.size-card{border:1px solid var(--line);border-radius:12px;padding:22px 26px 14px;display:flex;flex-direction:column;
  align-items:center;gap:14px;cursor:pointer;transition:.14s;background:#FCFCFD;min-width:170px;overflow:hidden;max-width:100%}
.size-card > *{max-width:100%}
.size-card:hover{border-color:#CFD3E6}
.size-card.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.11);background:#fff}
.size-meta{text-align:center}
.size-meta b{display:block;font-size:13px}
.size-meta span{font-size:11px;color:var(--muted)}

/* ---------------- inspector ---------------- */
.insp{width:392px;flex:0 0 392px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 24px}
.tabs button{flex:1;border:0;background:transparent;padding:15px 0 13px;cursor:pointer;color:var(--muted);font-weight:600;
  font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.14s}
.tabs button:hover{color:var(--text-2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.insp-scroll{flex:1;overflow-y:auto;padding:20px 24px 40px}
.grp{margin-bottom:26px}
.grp-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.grp-t .link{color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0}
.grp-t .link:hover{text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 13px;cursor:pointer;color:var(--text-2);
  font-size:12.5px;transition:.13s;font-weight:540;white-space:nowrap}
.pill:hover{border-color:#CFD3E6;background:#FAFAFC}
.pill.on{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);font-weight:640}
.radios{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px 8px}
.radio{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-2);font-size:12.8px;user-select:none;white-space:nowrap}
.radio i{width:15px;height:15px;border-radius:50%;border:1.5px solid #C8CBD6;flex:0 0 15px;display:grid;place-items:center;transition:.14s}
.radio.on{color:var(--text);font-weight:560}
.radio.on i{border-color:var(--accent);border-width:4.5px}
.radio:hover i{border-color:#A9AEC0}
.radio.on:hover i{border-color:var(--accent)}

.tokens{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:12.3px}
.trow:nth-child(odd){background:#FAFAFC}
.trow .tk{color:var(--text-2);font-family:var(--mono);font-size:11.5px}
.trow .tv{font-weight:620;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px;text-align:right}
.trow .tv.hex{color:var(--accent);font-family:var(--mono);font-size:11.5px}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.14);flex:0 0 11px}
.sw.grad{width:22px}
.tokchips{margin-top:10px}
.tok{display:inline-block;font-family:var(--mono);font-size:10.5px;background:#F6F7FA;border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;margin:0 5px 5px 0;color:var(--text-2)}

.callout{background:#FFF8E6;border:1px solid #F3DFA5;border-radius:10px;padding:12px 13px;display:flex;gap:10px;
  color:#8A6410;font-size:12.3px;font-style:italic;line-height:1.55}
.callout svg{flex:0 0 16px;margin-top:1px;color:#C48A16}
.callout.plain{font-style:normal}

pre.code{margin:0;background:#14161C;color:#D7DBE8;border-radius:10px;padding:14px;font-family:var(--mono);font-size:10.8px;
  line-height:1.65;overflow:auto;max-height:340px}
.code .c-p{color:#93A3FF}.code .c-v{color:#7FE3B1}.code .c-s{color:#5C6479}
.kv{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:5px 0;font-size:12.3px}
.kv .k{color:var(--muted);flex:0 0 auto}
.kv .v{color:var(--text);text-align:right;font-family:var(--mono);font-size:11.3px;word-break:break-word;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.doc ul{margin:0;padding-left:17px}
.doc li{margin:6px 0;color:var(--text-2);font-size:12.4px}
.doc li b{color:var(--text);font-weight:620}
.do li::marker{color:#16A34A}.dont li::marker{color:#EF4444}
.copy{border:1px solid var(--line);background:#FAFAFC;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:10.5px;
  color:var(--text-2);font-weight:660;letter-spacing:.04em;text-transform:uppercase}
.copy:hover{background:#fff;color:var(--text)}
.field{width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:#FBFBFD;padding:0 10px;outline:0;transition:.13s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.12);background:#fff}
.rowsw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.rowsw label{color:var(--text-2);font-size:12.8px}
.tog{width:36px;height:21px;border-radius:20px;background:#DFE1EA;position:relative;cursor:pointer;transition:.16s;flex:0 0 36px}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.22)}
.tog.on{background:var(--accent)}.tog.on::after{transform:translateX(15px)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(15,18,28,.44);display:none;z-index:80;backdrop-filter:blur(3px)}
.modal.on{display:grid;place-items:center}
.sheet{width:min(900px,92vw);height:min(80vh,780px);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 26px 70px -20px rgba(10,14,26,.5)}
.sheet-head{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
.sheet-body{flex:1;overflow:auto;padding:18px;background:#FBFBFD}
.sheet-body pre{margin:0;font-family:var(--mono);font-size:11.5px;line-height:1.62;color:var(--text-2);white-space:pre-wrap}

/* ---- stacked (vertical) artboard layout ---- */
.vstack{display:flex;flex-direction:column;gap:26px;width:100%}
.vgroup{display:flex;flex-direction:column}
.vgroup-title{
  font-size:13px;font-weight:660;color:var(--text);letter-spacing:-.012em;
  padding:0 0 10px;border-bottom:1px solid var(--line);margin-bottom:2px;
}
.vrow{
  display:grid;align-items:center;gap:20px;padding:13px 10px 13px 18px;
  cursor:pointer;transition:background .18s cubic-bezier(.3,0,.2,1);margin:0 -10px;position:relative;
}
/* a thin marker on the left edge instead of flooding the whole row with colour */
.vrow::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:transparent;transition:background .18s, transform .18s;transform:scaleY(.4);
}
.vrow:hover::before{background:#D4D7E3;transform:scaleY(1)}
.vrow.on::before{background:linear-gradient(180deg,#7C6BF5,var(--accent));transform:scaleY(1)}
.vrow:hover{background:linear-gradient(90deg,rgba(84,100,242,.045),rgba(84,100,242,0) 45%)}
.vrow.on{background:linear-gradient(90deg,rgba(84,100,242,.085),rgba(84,100,242,0) 60%)}
.vrow + .vrow{border-top:1px solid var(--line-2)}
.vrow-label{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;transition:color .18s;
}
.vrow:hover .vrow-label{color:var(--text-2)}
.vrow.on .vrow-label{color:var(--accent)}
/* the component itself carries the selection, like a canvas object */
.vrow-cell{display:inline-flex;align-items:center;justify-self:start;min-width:0;max-width:100%;position:relative}
.vrow-cell::after{
  content:"";position:absolute;inset:-9px -11px;border-radius:10px;
  border:1px solid transparent;transition:border-color .18s, box-shadow .18s;pointer-events:none;
}
.vrow:hover .vrow-cell::after{border-color:#DDE0EC}
.vrow.on .vrow-cell::after{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,100,242,.11)}
/* corner ticks, only when selected */
.vrow-cell i.tick{
  position:absolute;width:5px;height:5px;background:#fff;border:1px solid var(--accent);
  border-radius:1px;opacity:0;transition:opacity .18s;pointer-events:none;
}
.vrow.on .vrow-cell i.tick{opacity:1}
.vrow-cell i.t1{left:-13px;top:-11px}   .vrow-cell i.t2{right:-13px;top:-11px}
.vrow-cell i.t3{left:-13px;bottom:-11px}.vrow-cell i.t4{right:-13px;bottom:-11px}
.vrow-note{font-size:11.5px;color:var(--muted);line-height:1.55;max-width:340px}
.artboard.dark .vrow:hover{background:#20242E}
.artboard.dark .vgroup-title{color:#EDEFF5;border-bottom-color:#262B36}
.artboard.dark .vrow + .vrow{border-top-color:#20242B}
.seg button svg{display:block}


/* ---- token / palette page ---- */
.tokset{display:flex;flex-direction:column;gap:30px;width:100%}
.tokgrp-title{font-size:13px;font-weight:660;letter-spacing:-.012em;padding-bottom:10px;
  border-bottom:1px solid var(--line);margin-bottom:14px}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:12px}
.swcard{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;cursor:pointer;transition:.15s}
.swcard:hover{border-color:var(--accent-line);box-shadow:0 2px 10px -4px rgba(20,24,36,.22);transform:translateY(-1px)}
.swbar{display:flex;height:46px}
.swbar span{flex:1}
.swmeta{padding:8px 10px 9px}
.swname{font-size:11.8px;font-weight:600;color:var(--text);line-height:1.35}
.swhex{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.swnote{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.artboard.dark .swcard{background:#181D26;border-color:#242B37}
.artboard.dark .swname{color:#EDF0F6}
.artboard.dark .tokgrp-title{color:#EDF0F6;border-bottom-color:#262B36}

/* rendered component */
.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  font-family:"Zoho Puvi","Inter",-apple-system,"Segoe UI",Roboto,sans-serif;white-space:nowrap;user-select:none;cursor:pointer;
  overflow:hidden;position:relative;border-style:solid;transition:background .12s linear,border-color .12s linear}
.btn.no-int{cursor:default}
.btn[data-state="disabled"]{cursor:not-allowed}
.spin{border-radius:50%;border-style:solid;border-color:currentColor;border-top-color:transparent!important;animation:sp .7s linear infinite;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.lnk{font-family:"Zoho Puvi","Inter",-apple-system,sans-serif;font-size:14px;font-weight:500;cursor:pointer}
</style>
</head>
<body>

<script type="text/plain" data-md="Buttons"># Buttons
> Category: Components / Atoms > Version: v2.0.0

Buttons allow users to take actions, and make choices, with a single tap. They communicate actions and are typically placed throughout your UI in places like dialogs, forms, toolbars, and cards.

---

## Anatomy

The visual breakdown and structure of the standard CRM Button component, with full color token references per layer.

### Container Layer

| Part | Description |
|---|---|
| Type | Frame with Horizontal Auto Layout |
| Corner Radius | 6px (Default), 4px (Small, Extreme Small) |
| Border | 0px (filled/ghost buttons), 1px (outline/default buttons) |
| Height | 32px (Default), 27px (Small), 19px (Extreme Small) |
| Clip Content | Yes |

#### Container Background Colors

| Variant | Default | Hover | Click | Disabled |
|---|---|---|---|---|
| Primary | Gradient ↑ #124DC3 → #5767F6 (tokens 90298:926, 90298:925) | Gradient ↑ #0E3B98 → #3E4DEC (tokens 90298:961, 90298:960) | Solid #1344A9 (token 90298:962) | Solid #ADB3EE (token 90298:963) |
| Default | Gradient ↓ #FFFFFF → #F1F0F7 (tokens 90298:970, 90298:971) | Gradient ↓ #FFFFFF → #EAEBF5 (tokens 90298:980, 90298:981) | Solid #F0F1F8 (token 90298:991) | Solid #F7F7FB (token 90298:999) |
| Success | Gradient ↓ #11B670 → #0F935B (tokens 90298:1036, 90298:1037) | Gradient ↓ #13C177 → #0F9A5F (tokens 90298:1048, 90298:1049) | Solid #0F935B (token 90298:1053) | Solid #67CCA1 (token 90298:1057) |
| Negative | Gradient ↓ #FF4657 → #E23041 (tokens 90298:1011, 90298:1012) | Gradient ↓ #FC5060 → #D30B1E (tokens 90298:1020, 90298:1021) | Solid #D30B1E (token 90298:1025) | Solid #FFB1B8 (token 90298:1029) |
| Warning | Gradient ↓ #F5973A → #DB852F (tokens 90298:1065, 90298:1066) | Gradient ↓ #F5973A → #CF7D2B (tokens 90298:1067, 90298:1068) | Solid #CF7D2B (token 90298:1069) | Solid #EEBB8B (token 90298:1071) |
| Outline Blue | Solid #F0F1FF (token 90298:1110) | Solid #E5E8FF (token 90298:1112) | Solid #E5E8FF (token 90298:1112) | #F0F1FF opacity 0.6 (token 90298:1111) |
| Outline Green | Solid #E9FBF4 (token 90298:1114) | Solid #DCF7EB (token 90298:1115) | Solid #DCF7EB (token 90298:1115) | #E9FBF4 opacity 0.6 (token 90298:1117) |
| Outline Red | Solid #FFF2F3 (token 90298:1118) | Solid #FFE8EA (token 90298:1119) | Solid #FFE8EA (token 90298:1119) | #FFF2F3 opacity 0.5 (token 90298:1121) |
| Outline Orange | Solid #FFF9ED (token 90298:1124) | Solid #FEF2DA (token 90298:1125) | Solid #FEF2DA (token 90298:1126) | #FFF9ED opacity 0.6 (token 90298:1127) |
| Ghost Blue | Transparent | Solid #EEEFFF (token 90298:1122) | Solid #EEEFFF (token 90298:1122) | Transparent, opacity 0.6 |
| Ghost Red | Transparent | Solid #FFE8EA (token 90298:1123) | Solid #FFE8EA (token 90298:1123) | Transparent, opacity 0.6 |
| Zia (Filled) | Gradient → #1471D9 → #E21565 (tokens 90298:1357, 90298:1358) | — | — | — |
| Zia (Outline) | Gradient #EEF7FF → #FFEFF5 (tokens 90298:1361, 90298:1362) | — | — | — |

| Line Height | AUTO |

### Leading Icon Layer (Optional)

| Property | Value |
|---|---|
| Size | 16×16px (Default), 14×14px (Small), 12×12px (Extreme Small) |

| Property | Value |

| Position | Right of label |
| Spacing from label | 3px |
| Color | Inherits label color |
| Transform | Rotates 180° when dropdown is open |

## Usage Guidelines

### Do

1. Maintain clear hierarchy - Use one Primary action per screen space. Accompany with Default or Ghost buttons for secondary actions.
2. Use concise, active verbs - Label buttons with explicit CRM actions like "Create Lead", "Export CSV", or "Send Invite".
3. Always pair Primary with Default - Every Primary Button should have a Default "escape" nearby (Cancel, Close, Back).
4. Use Loading state for async - Always show Loading state during API calls, file uploads, and data processing.
5. Size consistency in groups - All buttons in the same row must use the same size tier.
6. Reference design tokens - Always use token IDs, never hardcode hex values.
7. Destructive actions need confirmation - Negative buttons should trigger a confirmation dialog.

### Don't

1. Avoid multiple competing primary actions - Multiple primary buttons side-by-side causes action confusion.
2. Avoid vague passive labels - Avoid "Click Here" or "Proceed". Use descriptive labels.
3. Don't use Negative for Cancel - Cancel is Default variant. Negative is ONLY for destructive actions.
4. Don't mix button sizes - Never combine 32px, 27px, and 19px in the same group.
5. Don't create custom colors - Only use approved variant tokens.
6. Don't use Extreme Small as primary CTA - 19px buttons for dense desktop UIs only.
7. Don't remove focus indicators - Keyboard accessibility requires visible focus rings.

## CSS Custom Properties

```css
:root {
  --input-height: 34px;
  --input-height-small: 27px;
  --input-radius: 6px;
  --input-padding-y: 8px;
  --input-padding-x: 10px;

  --input-default-outline: #C0C8E2;
  --input-hover-outline: #797883;
  --input-focus-outline: #5464F2;
  --input-focus-shadow: #4c5efd80; /* box-shadow color, 6px blur, no spread */
  --input-error-outline: #FF5D5A;
  --input-disable-outline: #D2D9F1;
  --input-disable-bg: #F5F6F8;
  --input-icon-bg: #F4F4F6;
  --input-placeholder-text: #8C91AB;
  --input-auto-update-bg: #FFFFEA; /* background for auto-filled/system-updated fields */
}
```

## Base structure

Every input is a bordered box with a **3px colored indicator bar** flush against the inner-left edge (present in all states — transparent/matching background in Default, colored in Error/Mandatory). Content area uses `10px` horizontal / `8px` vertical padding.

```css
.input {
  display: flex;
  align-items: center;
  height: var(--input-height);
  border: 1px solid var(--input-default-outline);
  border-radius: var(--input-radius);
  background: #ffffff;
}
.input__indicator-bar {
  width: 3px;
  height: 32px; /* height - 2px for border */
}
.input__content {
  flex: 1;
  padding: var(--input-padding-y) var(--input-padding-x);
  display: flex;
  align-items: center;
  gap: 10px;
}
.input__text {
  font-family: 'Zoho Puvi', sans-serif;
  font-size: 14px;
  font-weight: 400;
}
.input__placeholder { color: var(--input-placeholder-text); }
```

| State | Border | Background | Notes |

| Default | `--input-default-outline` (`#C0C8E2`) | `#FFFFFF` | |
| Hover | `--input-hover-outline` (`#797883`) | `#FFFFFF` | |
| Focus | `--input-focus-outline` (`#5464F2`) | `#FFFFFF` | Add `box-shadow: 0 0 6px var(--input-focus-shadow)` |
| Error / Mandatory | `--input-error-outline` (`#FF5D5A`) | `#FFFFFF` | Indicator bar also turns red. Helper text below, 11px, same red — see `typography.md` restricted-font note |
| Disabled | `--input-disable-outline` (`#D2D9F1`) | `--input-disable-bg` (`#F5F6F8`) | |

.input:hover { border-color: var(--input-hover-outline); }
.input:focus-within {
  border-color: var(--input-focus-outline);

}

## Input with Icon

A variant exists with an icon inside the field (`--input-icon-bg: #F4F4F6` for the icon's background chip). Use this for search fields, currency fields (e.g. "USD" label prefix seen in this sheet), or fields needing a leading/trailing icon.

## Usage Rules

- Always pair inputs with a `<label>` element (not shown in this sheet, but standard practice — confirm label typography from a dedicated label frame if available).
- Use the auto-update background (`#FFFFEA`) sparingly — only for fields the system has just populated automatically, to draw the user's attention.
- Never combine Error state styling with Disabled state — disabled fields shouldn't show validation errors.
- Keep Input, Dropdown, and Search components visually consistent at 34px height per this system's own annotation.
- Restricted 11px font is reserved for input error/helper text only (see `typography.md`).

## CSS Custom Properties

## Base

```css
.switch-track {
  width: var(--switch-track-width);
  height: var(--switch-track-height);
  border-radius: 100px;
  background: var(--switch-track-off);
  position: relative;
  cursor: pointer;
}
.switch-thumb {
  width: var(--switch-thumb-size);
  height: var(--switch-thumb-size);
  border-radius: 100px;
  background: var(--switch-thumb-bg);
  position: absolute;
  top: var(--switch-thumb-inset);
  left: var(--switch-thumb-inset); /* becomes left: 14px when active */
  transition: left 0.15s ease;
}
.switch-track--active {
  background: var(--switch-track-on);
}
.switch-track--active .switch-thumb {
  left: 14px; /* track width (30) - inset (2) - thumb (14) */
}
.switch-track--disabled {
  background: var(--switch-track-disabled);
  cursor: not-allowed;
}
.switch-track--disabled .switch-thumb {
  background: var(--switch-thumb-disabled-bg);
}
```

## Color Rules

- Reserve Red exclusively for destructive or error states.
- Use Green only for success or completion states.
- Use Orange for warnings and attention-required indicators.
- Blue indicates links, informational content, or neutral interactive elements.
- Purple is reserved for skipped or optional states.
- Status tag colors are always used as a bg + border + text set — never mix and match.
- Kanban colors are for visual grouping/categorization only — never use them to indicate status.
- Pastel colors should be used sparingly — only for cards, illustrations, AI suggestions, and empty states.
- Keep status colors consistent across tables, badges, alerts, banners, and cards.
- Prefer semantic color tokens instead of hardcoded hex values.

/* ============================================================================
   1. GENERIC MARKDOWN PARSER — knows nothing about any specific component
   ========================================================================== */
function parseMD(src){
  const lines = src.split(/\r?\n/);
  const root = {title:'__root__', level:0, children:[], tables:[], lines:[]};
  const stack = [root];
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if(h){
      const level = h[1].length;
      while(stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
      const node = {title:h[2].trim(), level, children:[], tables:[], lines:[]};
      stack[stack.length-1].children.push(node);
      stack.push(node);
      i++; continue;
    }
    if(/^\s*\|/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) buf.push(lines[i++]);
      const t = parseTable(buf);
      if(t) stack[stack.length-1].tables.push(t);
      continue;
    }
    stack[stack.length-1].lines.push(line);
    i++;
  }
  return root;
}
function parseTable(buf){
  const cells = s => s.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  if(buf.length < 2) return null;
  const headers = cells(buf[0]);
  if(!/^[\s|:-]+$/.test(buf[1])) return null;
  const rows = buf.slice(2).map(cells).filter(r=>r.length && r.some(c=>c));
  return {headers, rows, obj: rows.map(r=>{const o={};headers.forEach((h,i)=>o[h]=r[i]??'');return o;})};
}
function walk(node, fn){ (node.children||[]).forEach(c=>{fn(c); walk(c,fn);}); }
function section(root, title){ let hit=null; const want=norm(title); walk(root,n=>{ if(!hit && norm(n.title)===want) hit=n; }); return hit; }
function tableOf(root, title, idx){ const s=section(root,title); return s ? s.tables[idx||0] : null; }
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
/* pull one section back out of the raw markdown, headings and tables intact */
function sliceSection(src, title){
  const lines = String(src).split(/\r?\n/);
  const want = norm(title);
  let start=-1, level=0;
  for(let i=0;i<lines.length;i++){
    const m=/^(#{1,6})\s+(.*)$/.exec(lines[i]);
    if(m && norm(m[2])===want){ start=i; level=m[1].length; break; }
  }
  if(start<0) return null;
  let end=lines.length;
  for(let i=start+1;i<lines.length;i++){
    const m=/^(#{1,6})\s+/.exec(lines[i]);
    if(m && m[1].length<=level){ end=i; break; }
  }
  const out = lines.slice(start,end);
  while(out.length && /^(\s*|-{3,})$/.test(out[out.length-1])) out.pop();
  return out.join('\n');
}

/* ============================================================================
   2. VALUE PARSERS — markdown cell text -> renderable style data
   ========================================================================== */
function normHex(h, warn){
  let v = h.replace('#','');
  if(v.length===3||v.length===4) v = v.split('').map(c=>c+c).join('').slice(0,6);
  else if(v.length!==6 && v.length!==8){
    const fixed = (v+'FFFFFF').slice(0,6);
    if(warn){
      const w = {raw:'#'+v.toUpperCase(), fixed:'#'+fixed.toUpperCase(), why:v.length+'-digit hex in the markdown, padded to 6'};
      if(!warn.some(x=>x.raw===w.raw)) warn.push(w);
    }
    v = fixed;
  }
  return '#'+v.toUpperCase();
}
let WARN = [];
function hexes(s){ return (String(s).match(/#[0-9A-Fa-f]{3,8}\b/g)||[]).map(h=>normHex(h,WARN)); }
function tokens(s){ return String(s).match(/\b\d{4,6}:\d+\b/g) || []; }
function opacityOf(s){ const m=/opacity\s*([0-9]*\.?[0-9]+)/i.exec(s) || /\(\s*(0?\.[0-9]+)\s*\)/.exec(s); return m?parseFloat(m[1]):1; }
function parseFill(str){
  const s = String(str||'').trim();
  if(!s || s==='—' || s==='-') return null;
  const out = {raw:s, tokens:tokens(s), opacity:opacityOf(s)};
  const hx = hexes(s);
  if(/gradient/i.test(s) && hx.length>=2){
    out.type='gradient'; out.colors=hx;
    out.arrow = s.includes('↑')?'↑' : s.includes('↓')?'↓' : s.includes('→')?'→' : '↓';
    out.angle = out.arrow==='↑' ? 0 : out.arrow==='→' ? 90 : 180;
    out.css = 'linear-gradient('+out.angle+'deg, '+hx[0]+' 0%, '+hx[hx.length-1]+' 100%)';
    return out;
  }
  if(hx.length){ out.type='solid'; out.colors=[hx[0]]; out.css=hx[0]; return out; }

  out.colors=[]; out.css='transparent';
  return out;
}
function parseBorder(str){
  const s = String(str||'').trim();
  if(!s || s==='—' || s==='-' || /^none/i.test(s)) return {width:0, raw:s||'None', tokens:[], opacity:1};
  const w = /(\d+(?:\.\d+)?)px/.exec(s), hx = hexes(s);

  return {width, color:hx[0], colors:hx, gradient:/gradient/i.test(s), opacity:opacityOf(s), raw:s, tokens:tokens(s)};

function parseColor(str){ const hx=hexes(str); return {hex:hx[0]||null, opacity:opacityOf(str), raw:String(str||'')}; }

  if(a>=1) return hex;

  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============================================================================
   3. MODEL BUILDER — any .md with the standard tables becomes a live component
   ========================================================================== */
const ALIAS = {ziafilled:'ziafill'};
const key = s => { const n=norm(s); return ALIAS[n]||n; };
const PRETTY = {'Zia (Filled)':'Zia Fill','Zia (Outline)':'Zia Outline'};

/* The library supports two markdown shapes:
   A "matrix"  — a Container Background Colors table, variants as rows, states as columns (Buttons.md)
   B "states"  — a States table, states as rows, values as CSS custom properties (Inputs.md)
   Both are normalised into M.STATES + M.CELLS below, so everything downstream is shape-agnostic. */
const MATRIX_STATES_DEFAULT = [
  {id:'default', name:'Default', col:'Default'},
  {id:'hover',   name:'Hover',   col:'Hover'},
  {id:'click',   name:'Pressed', col:'Click'},
  {id:'disabled',name:'Disabled',col:'Disabled'},
  {id:'loader',  name:'Loading', col:null},
  {id:'focus',   name:'Focus',   col:'Default', synthetic:true}
];

/* strip markdown code ticks so `--x` (`#FFF`) parses like plain text */
const untick = s => String(s||'').replace(/`/g,'');
/* every --custom-property found in fenced css blocks */
function parseCssVars(src){
  const out = {};
  String(src).replace(/--([a-zA-Z0-9-]+)\s*:\s*([^;\n}]+)/g, (m,k,v)=>{ out[k.toLowerCase()] = v.trim(); return m; });

/* first value of a css declaration anywhere in the file, e.g. cssDecl(src,'font-size') */
function cssDecl(src, prop){

  return m ? m[1].trim() : '';

/* resolve var(--x) against the parsed custom properties */
function resolveVars(str, vars){
  return String(str||'').replace(/var\(\s*--([a-zA-Z0-9-]+)\s*\)/g, (m,k)=> vars[k.toLowerCase()] || m);
}
function varLike(vars, re, fb){
  const k = Object.keys(vars).find(k=>re.test(k));
  return k ? px(vars[k], fb) : fb;
}

/* ---- CSS rule parsing: many of these files carry their spec as CSS, not tables ---- */
function parseCssRules(src){
  const rules = [];
  String(src).replace(/```css([\s\S]*?)```/g, function(m, body){
    body.replace(/([^{}]+)\{([^}]*)\}/g, function(mm, sel, decls){
      const d = {};
      decls.replace(/([-a-zA-Z]+)\s*:\s*([^;]+)/g, function(x,k,v){ d[k.trim().toLowerCase()] = v.trim(); return x; });

        if(s && s !== ':root' && !/^@/.test(s)) rules.push({sel:s, d:d});

    bg: bg ? R(bg) : null,
    border: border ? R(border) : null,
    text: d.color ? R(d.color) : null,

function modelFromCss(src, vars){
  const rules = parseCssRules(src);
  const classRules = rules.filter(r => /^\.[-\w]+$/.test(r.sel));
  if(!classRules.length) return null;

  let base = null, best = -1;
  classRules.forEach(r => {
    const built = rules.filter(x => x.sel !== r.sel && x.sel.indexOf(r.sel) === 0).length;
    const score = built*10 + ((r.d.background||r.d['background-color']) ? 2 : 0) + (r.d.border ? 1 : 0);
    if(score > best){ best = score; base = r; }
  });
  if(!base) return null;

  const modRe   = new RegExp('^'+reEsc(base.sel)+'--([\\w-]+)$');
  const stateRe = new RegExp('^'+reEsc(base.sel)+':([\\w-]+)$');

  const mods = rules.filter(r => modRe.test(r.sel))
                    .map(r => ({raw: modRe.exec(r.sel)[1], d: r.d}));
  const sizeMods = mods.filter(m => Object.keys(m.d).length && Object.keys(m.d).every(DIMENSION_ONLY));
  const varMods  = mods.filter(m => sizeMods.indexOf(m) < 0);
  const stateRules = rules.filter(r => stateRe.test(r.sel))
                          .map(r => ({raw: stateRe.exec(r.sel)[1], d: r.d}));

  const baseName = titleCase(base.sel.replace(/^\./,'').replace(/-(track|box|field|container)$/,''));
  const baseHasFill = !!(base.d.background || base.d['background-color']);
  const VARIANTS = ((!baseHasFill && varMods.length) ? [] : [{id:'default', raw:baseName, name:baseName}]).concat(
    varMods.map(m => ({id:key(m.raw), raw:m.raw, name:titleCase(m.raw)}))
  );
  const STATES = [{id:'default', name:'Default'}].concat(
    stateRules.map(s => ({id:key(s.raw), name:titleCase(s.raw.replace('focus-visible','Keyboard focus')), explicit:true}))
  );

  const CELLS = {};
  VARIANTS.forEach(v => {
    const vd = (v.id === 'default' && baseHasFill) ? null : (varMods.find(m => key(m.raw) === v.id)||{}).d;
    CELLS[v.id] = {};
    STATES.forEach(st => {
      const sd = st.id === 'default' ? null : (stateRules.find(s => key(s.raw) === st.id)||{}).d;
      CELLS[v.id][st.id] = cellFromDecls([base.d, vd, sd], vars);
    });
  });

  // sub-parts, e.g. .switch-thumb — needed to draw a switch properly
  const PARTS = {};
  rules.forEach(r => {
    const m = /^\.[-\w]+[-_]{1,2}([\w-]+)$/.exec(r.sel);
    if(m && !modRe.test(r.sel)) PARTS[key(m[1])] = cellFromDecls([r.d], vars);
  });

  const firstV = (VARIANTS[0]||{}).id;
  const baseCell = (CELLS[firstV] && CELLS[firstV].default) || cellFromDecls([base.d], vars);
  const SIZES = sizeMods.length
    ? sizeMods.map(m => {
        const c = cellFromDecls([m.d], vars);
        return {raw:m.raw, name:titleCase(m.raw), height:c.height, width:c.width || baseCell.width};
      })
    : [{raw:'default', name:'Default', height:baseCell.height, width:baseCell.width}];

  return {VARIANTS, STATES, CELLS, PARTS, SIZES, baseCell, rules};
}

/* A Variants table that carries Background / Border columns (tooltip.md) */
function modelFromVariantTable(T, vars){
  const t = T.variants;
  if(!t) return null;
  const h = t.headers;
  const cBg = h.find(x=>/background|fill/i.test(x));
  const cBd = h.find(x=>/border|outline/i.test(x));
  if(!cBg && !cBd) return null;
  const VARIANTS = t.rows.map(r => ({id:key(r[0]), raw:r[0], name:r[0].replace(/\s*\(.*?\)\s*/,'').trim()}));
  const STATES = [{id:'default', name:'Default'}];
  const CELLS = {};
  t.obj.forEach(r => {
    const id = key(r[h[0]]);
    const bg = untick(r[cBg]||''), bd = untick(r[cBd]||'');
    CELLS[id] = { default: {
      bg: hexes(bg).length ? resolveVars(bg,vars) : null,
      border: hexes(bd).length ? '1px '+resolveVars(bd,vars) : null,
      note: h.find(x=>/usage|note/i.test(x)) ? untick(r[h.find(x=>/usage|note/i.test(x))]) : null
    }};
  });
  return {VARIANTS, STATES, CELLS};
}

/* A file of colour tables and nothing else (colors.md) — render it as a palette */
function modelFromTokens(DOC){
  const groups = [];
  walk(DOC, function(n){
    n.tables.forEach(function(t){
      const rows = t.obj.map(function(r){
        const cols = t.headers.slice(1)
          .map(function(h){ const hx = hexes(untick(r[h])); return hx.length ? {col:h, hex:hx[0]} : null; })
          .filter(Boolean);
        return cols.length ? {label: untick(r[t.headers[0]]), colors: cols,
                              note: t.headers.find(function(h){return /usage/i.test(h);}) ? untick(r[t.headers.find(function(h){return /usage/i.test(h);})]) : ''} : null;
      }).filter(Boolean);
      if(rows.length >= 2) groups.push({title: n.title, rows: rows});
    });
  });
  return groups.length >= 2 ? groups : null;
}

function buildModel(src, fallbackName){
  WARN = [];
  const DOC = parseMD(src);
  const head = DOC.children[0] || {title:fallbackName, lines:[]};
  const CSSVARS = parseCssVars(src);
  const meta = (function(){
    const l = (head.lines||[]).join(' ');
    const v = /Version:\s*(v?[\d.]+)/i.exec(l), c = /Category:\s*([^>]+)/i.exec(l), p = /Preview:\s*(\w+)/i.exec(l);
    const name = head.title || fallbackName;
    let preview = p ? norm(p[1]) : null;
    if(!preview){   // no explicit hint — infer from the component's name
      const n = norm(name);
      preview = /switch|toggle/.test(n) ? 'switch'
              : /description|textarea|message/.test(n) ? 'textarea'
              : /input|field|search|dropdown|select/.test(n) ? 'field'
              : /checkbox|radio/.test(n) ? 'indicator' : 'box';
    }
    return {version:v?v[1]:'', category:c?c[1].trim():'', name, preview};
  })();

  const T = {
    bg:tableOf(DOC,'Container Background Colors'), border:tableOf(DOC,'Container Border Colors'),
    label:tableOf(DOC,'Label Text Colors'), loader:tableOf(DOC,'Loader Colors per Variant'),
    variants:tableOf(DOC,'Variants'), sizes:tableOf(DOC,'Sizes'), pad:tableOf(DOC,'Spacing & Padding'),
    focus:tableOf(DOC,'Focus Ring Layer (Keyboard Focus)'), labelLyr:tableOf(DOC,'Label Text Layer'),
    groups:tableOf(DOC,'Button Grouping Combinations'), colorVar:tableOf(DOC,'Color Variants'),
    states:tableOf(DOC,'States')
  };
  function indexBy(t,col){ const m={}; if(t) t.obj.forEach(r=>{ m[key(r[col||t.headers[0]])] = r; }); return m; }
  const I = {
    bg:indexBy(T.bg), border:indexBy(T.border), label:indexBy(T.label), loader:indexBy(T.loader),
    variants:indexBy(T.variants), color:indexBy(T.colorVar,'Name')
  };

  /* ---- which shape is this file? ---- */
  const statesTable = (T.states && T.states.headers.some(h=>/border|background|fill/i.test(h))) ? T.states : null;
  let SHAPE = T.bg ? 'matrix' : (statesTable ? 'states' : null);

  let VARIANTS = [], STATES = [], CELLS = {};

  if(SHAPE === 'matrix'){
    VARIANTS = T.bg.rows.map(r=>({id:key(r[0]), raw:r[0], name:PRETTY[r[0]]||r[0]}));
    STATES = MATRIX_STATES_DEFAULT.slice();
    VARIANTS.forEach(v=>{
      const bgRow=I.bg[v.id]||{}, bdRow=I.border[v.id]||{}, ldRow=I.loader[v.id]||{};
      CELLS[v.id] = {};
      STATES.forEach(st=>{
        if(st.id === 'loader'){
          const raw = ldRow[T.loader?T.loader.headers[2]:''] || '';
          const hx = hexes(raw);
          CELLS[v.id].loader = {
            bg: raw || null,
            border: hx.length>1 ? '1px '+hx[1] : (bdRow['Default']||'None'),
            spinner: hexes(ldRow[T.loader?T.loader.headers[1]:'']||'')[0] || null,
            fallback: raw ? null : (bgRow['Click'] && bgRow['Click']!=='—' ? 'Click' : 'Default')
          };
        } else {
          const col = st.col;
          CELLS[v.id][st.id] = {
            bg: (bgRow[col] && bgRow[col]!=='—') ? bgRow[col] : null,
            border: (bdRow[col]!==undefined && bdRow[col]!=='—') ? bdRow[col] : (bdRow['Default']||'None'),
            fallback: (bgRow[col] && bgRow[col]!=='—') ? null : 'Default'
          };
        }
      });
    });
  }

  if(SHAPE === 'states'){
    // one implicit variant; the file's own state rows become the columns
    const base = meta.name.replace(/\s*\(.*?\)\s*/g,'').trim().replace(/s$/,'') || 'Default';
    VARIANTS = [{id:'default', raw:base, name:base}];
    const h = statesTable.headers;
    const cBorder = h.find(x=>/border|outline/i.test(x));
    const cBg     = h.find(x=>/background|fill/i.test(x));
    const cNotes  = h.find(x=>/note|desc/i.test(x));
    CELLS.default = {};
    STATES = statesTable.obj.map(r=>{
      const nameRaw = r[h[0]];
      const id = key(nameRaw);
      const bgRaw = resolveVars(untick(r[cBg]||''), CSSVARS);
      const bdRaw = resolveVars(untick(r[cBorder]||''), CSSVARS);
      const note  = resolveVars(untick(r[cNotes]||''), CSSVARS);
      const sh = /box-shadow\s*:\s*([^;`]+)/i.exec(note);
      CELLS.default[id] = {
        bg: /unchanged|inherit/i.test(bgRaw) || !hexes(bgRaw).length ? null : bgRaw,
        border: /unchanged|inherit/i.test(bdRaw) || !hexes(bdRaw).length ? null : ('1px '+bdRaw),
        shadow: sh ? resolveVars(sh[1].trim(), CSSVARS) : null,
        note: note || null,
        fallback: 'default'
      };
      return {id, name:nameRaw.replace(/\s*\/\s*/g,' / '), col:nameRaw, explicit:true};
    });
    if(!STATES.some(s=>s.id==='default')) STATES.unshift({id:'default', name:'Default', col:'Default'});
  }

  let PARTS = {}, TOKENGROUPS = null, cssSizes = null, baseCell = null;

  if(!SHAPE){
    const cm0 = modelFromCss(src, CSSVARS);
    if(cm0 && cm0.VARIANTS.length > 1){
      SHAPE='css'; VARIANTS=cm0.VARIANTS; STATES=cm0.STATES; CELLS=cm0.CELLS; PARTS=cm0.PARTS;
      cssSizes=cm0.SIZES; baseCell=cm0.baseCell;
      // a Variants table alongside the css still supplies the usage copy
      if(T.variants){
        const uh = T.variants.headers.find(h=>/usage|note|desc/i.test(h));
        if(uh) T.variants.obj.forEach(r=>{
          const id = key(r[T.variants.headers[0]]);
          if(CELLS[id] && CELLS[id].default) CELLS[id].default.note = untick(r[uh]);
        });
      }
    }
  }
  if(!SHAPE){
    const vt = modelFromVariantTable(T, CSSVARS);
    if(vt){ SHAPE='variants'; VARIANTS=vt.VARIANTS; STATES=vt.STATES; CELLS=vt.CELLS; }
  }
  if(!SHAPE){
    const cm = modelFromCss(src, CSSVARS);
    if(cm){
      SHAPE='css';
      VARIANTS=cm.VARIANTS; STATES=cm.STATES; CELLS=cm.CELLS; PARTS=cm.PARTS;
      cssSizes=cm.SIZES; baseCell=cm.baseCell;
    }
  }
  if(!SHAPE){
    const tg = modelFromTokens(DOC);
    if(tg){ SHAPE='tokens'; TOKENGROUPS=tg; }
  }

  /* ---- sizes ---- */
  function padCell(rowLabel, col, fb){
    if(!T.pad) return {main:fb, alt:fb, raw:''};
    const r = T.pad.obj.find(o=>norm(o[T.pad.headers[0]])===norm(rowLabel));
    if(!r) return {main:fb, alt:fb, raw:''};
    const raw = r[col] || '';
    const nums = String(raw).match(/(\d+(?:\.\d+)?)\s*px/g) || [];
    return {main:px(nums[0],fb), alt:nums[1]?px(nums[1],fb):px(nums[0],fb), raw};
  }
  const containerT = tableOf(DOC,'Container Layer');
  let docWidth = null;
  if(containerT){
    const r = containerT.obj.find(o=>/^(max\s*|min\s*)?width$/i.test(o[containerT.headers[0]]));
    if(r) docWidth = px(r[containerT.headers[1]], null);
  }
  // css custom properties act as defaults when the file has no Spacing & Padding table
  const cvRadius = varLike(CSSVARS, /radius/, null);
  const cvPadY   = varLike(CSSVARS, /padding-?y|padding-?block/, null);
  const cvPadX   = varLike(CSSVARS, /padding-?x|padding-?inline/, null);
  const cvFont   = px(cssDecl(src,'font-size'), null);
  const cvWeight = (/(\d{3})/.exec(cssDecl(src,'font-weight')||'')||[])[1] || null;
  const cvFamily = (cssDecl(src,'font-family')||'').replace(/['"]/g,'').split(',')[0].trim() || null;
  const cvGap    = px(cssDecl(src,'gap'), null);

  const wcol = (T.sizes?T.sizes.headers:[]).find(h=>/width/i.test(h));
  let SIZES = (T.sizes?T.sizes.rows:[]).map(r=>{
    const o={}; T.sizes.headers.forEach((h,i)=>o[h]=r[i]);
    const nm = o['Size'];
    const col = (T.pad?T.pad.headers:[]).find(h=>norm(h).startsWith(norm(nm))) || (T.pad?T.pad.headers[1]:'');
    const pl=padCell('Padding Left',col,cvPadX!=null?cvPadX:14), pr=padCell('Padding Right',col,cvPadX!=null?cvPadX:14);
    const pt=padCell('Padding Top',col,cvPadY!=null?cvPadY:8),  pb=padCell('Padding Bottom',col,cvPadY!=null?cvPadY:8);
    const gp=padCell('Item Spacing',col,cvGap!=null?cvGap:3);
    return {
      id:key(nm), name:nm, short:(nm==='Default'?'M':nm==='Small'?'S':'XS'),
      height:px(o['Height'],32),
      font:px(o['Font Size'], cvFont!=null?cvFont:14),
      radius:px(o['Corner Radius'], cvRadius!=null?cvRadius:6),
      icon:px(o['Icon Size'],16),
      padL:pl.main, padR_chev:pr.main, padR_plain:pr.alt, padT:pt.main, padB:pb.main,
      gap:gp.main, gapLoader:gp.alt,
      width: wcol ? px(o[wcol], docWidth) : docWidth
    };
  }).sort((a,b)=>b.height-a.height);   // largest first, whatever order the markdown listed
  if(!SIZES.length && cssSizes){
    // width may only be stated in prose, e.g. "Width sampled at `390px`"
    const sizeSec = section(DOC,'Sizes');
    const prose = sizeSec ? (sizeSec.lines||[]).join(' ') : '';
    const proseW = (/width[^.\n]*?(\d{2,4})\s*px/i.exec(prose)||[])[1];
    SIZES = cssSizes.map(z=>({
      id:key(z.raw), name:z.name, short:(z.name[0]||'M').toUpperCase(),
      height: z.height || baseCell.height || 32,
      font: cvFont!=null?cvFont:14,
      radius: baseCell.radius!=null ? baseCell.radius : (cvRadius!=null?cvRadius:6),
      icon: 16,
      padL: cvPadX!=null?cvPadX:10, padR_chev: cvPadX!=null?cvPadX:10, padR_plain: cvPadX!=null?cvPadX:10,
      padT: cvPadY!=null?cvPadY:8, padB: cvPadY!=null?cvPadY:8,
      gap: cvGap!=null?cvGap:6, gapLoader:10,
      width: z.width || (proseW?parseFloat(proseW):null) || baseCell.width || docWidth
    })).sort((a,b)=>(b.height||0)-(a.height||0));
  }
  if(!SIZES.length) SIZES = [{id:'default',name:'Default',short:'M',height:32,
    font:cvFont!=null?cvFont:14, radius:cvRadius!=null?cvRadius:6, icon:16,
    padL:cvPadX!=null?cvPadX:14, padR_chev:cvPadX!=null?cvPadX:14, padR_plain:cvPadX!=null?cvPadX:14,
    padT:cvPadY!=null?cvPadY:8, padB:cvPadY!=null?cvPadY:8, gap:cvGap!=null?cvGap:3, gapLoader:10, width:docWidth}];

  const FOCUS = (function(){
    const o={}; if(T.focus) T.focus.obj.forEach(r=>o[norm(r[T.focus.headers[0]])]=r[T.focus.headers[1]]);
    const fromVar = Object.keys(CSSVARS).find(k=>/focus.*(outline|border|ring)/.test(k));
    return {
      width:px(o.width,2), offset:px(o.offset,2),
      color: hexes(o.color||'')[0] || (fromVar ? (hexes(CSSVARS[fromVar])[0]||'#5464F2') : '#5464F2')
    };
  })();
  const LABEL_FONT = (function(){
    const o={}; if(T.labelLyr) T.labelLyr.obj.forEach(r=>o[norm(r[T.labelLyr.headers[0]])]=r[T.labelLyr.headers[1]]);
    const w=/(\d{3})/.exec(o.fontweight||'');
    return {
      family: o.fontfamily || cvFamily || 'Inter',
      weight: w ? w[1] : (cvWeight || '500'),
      lineHeight: o.lineheight || 'AUTO'
    };
  })();
  // text colour: a Label Text Colors table, else a placeholder/text custom property
  const TEXT_FALLBACK = (function(){
    const k = Object.keys(CSSVARS).find(k=>/placeholder|text/.test(k) && hexes(CSSVARS[k]).length);
    return k ? hexes(CSSVARS[k])[0] : '#313949';
  })();
  const LINKS = (function(){
    const s = section(DOC,'Links');
    if(!s) return [];
    return s.children.filter(c=>c.tables.length).map(c=>{
      const h = c.tables[0].headers;
      return {id:key(c.title), name:c.title, states:c.tables[0].obj.map(r=>({
        state:r[h[0]], color:parseColor(r[h[1]]), token:r[h[2]], deco:r[h[3]]
      }))};
    });
  })();
  // guidance: numbered Do / Don't lists, or dashed Usage Rules bullets
  const RULES = (function(){
    const nums = n => (n?n.lines:[]).filter(l=>/^\s*\d+\.\s+/.test(l)).map(l=>l.replace(/^\s*\d+\.\s+/,''));
    const dashes = n => (n?n.lines:[]).filter(l=>/^\s*[-*]\s+/.test(l)).map(l=>l.replace(/^\s*[-*]\s+/,''));
    const ug = section(DOC,'Usage Guidelines') || DOC;
    return {
      do: nums(section(DOC,'Do')),
      dont: nums(section(DOC,"Don't")),
      notes: dashes(section(DOC,'Usage Rules')).concat(dashes(section(DOC,'Usage'))).slice(0,8)
    };
  })();

  return {DOC, META:meta, T, I, SHAPE, CELLS, STATES, VARIANTS, SIZES, FOCUS, LABEL_FONT,
          TEXT_FALLBACK, CSSVARS, PARTS, TOKENGROUPS, LINKS, RULES, WARN:WARN.slice(), src};
}

/* the active model — every render function below reads from M */
let M = null, ACTIVE = null;
const LIB = [];

function registerMD(name, src){
  const model = buildModel(src, name);
  if(!model.VARIANTS.length && model.SHAPE!=='tokens') return {ok:false, why:'Needs either a “Container Background Colors” table (variants as rows) or a “States” table with Border / Background columns.'};
  const id = norm(model.META.name || name);
  const existing = LIB.findIndex(x=>x.id===id);
  const item = {id, name:model.META.name||name, file:name, model};
  if(existing>=0) LIB[existing]=item; else LIB.push(item);
  return {ok:true, item};
}

/* ============================================================================
   4. STYLE COMPUTATION — reads the normalised CELLS, so both shapes work
   ========================================================================== */
function computeStyle(vid,sid,stateId,opts){
  opts = opts||{};
  const T=M.T, I=M.I;
  const st = M.STATES.find(s=>s.id===stateId) || M.STATES[0];
  const size = M.SIZES.find(s=>s.id===sid) || M.SIZES[0];
  const cell = ((M.CELLS[vid]||{})[st.id]) || {};
  const notes = [];
  const isLoader = st.id === 'loader';

  let fill = parseFill(cell.bg);
  if(!fill){
    const fb = ((M.CELLS[vid]||{})[cell.fallback||'default'] || (M.CELLS[vid]||{})['default'] || {});
    fill = parseFill(fb.bg);
    if(cell.bg == null && st.id !== 'default'){
      notes.push(isLoader
        ? 'No loader row for this variant — using its resting fill.'
        : '“'+st.name+'” is not defined in the markdown — inheriting Default.');
    }
  }
  if(!fill) fill = {type:'none', colors:[], css:'transparent', opacity:1, raw:'—', tokens:[]};

  let border = parseBorder(cell.border);
  if(!cell.border){
    const fb = ((M.CELLS[vid]||{})['default'] || {});
    border = parseBorder(fb.border);
  }

  const lbRow = I.label[vid] || {};
  const lc = parseColor(lbRow[T.label?T.label.headers[1]:'']||'');
  const textColor = (cell.text && hexes(cell.text)[0]) || lc.hex || M.TEXT_FALLBACK;
  let textAlpha = 1;
  if(/disabl/.test(st.id) && fill.opacity>=1 && !/outline|ghost/.test(vid)) textAlpha = 0.5;

  const containerOpacity = Math.min(fill.opacity, border.opacity==null?1:border.opacity);
  const padR = opts.chevron ? size.padR_chev : size.padR_plain;
  const ldRow = I.loader[vid] || {};

  const outline = cell.outline ? parseBorder(cell.outline) : null;
  return {
    variantId:vid, sizeId:sid, stateId:st.id,
    height: cell.height || size.height,
    radius: cell.radius!=null ? cell.radius : size.radius,
    font: cell.font || size.font, iconSize:size.icon,
    padL: cell.padL!=null?cell.padL:size.padL, padR: cell.padR!=null?cell.padR:padR,
    padT: cell.padT!=null?cell.padT:size.padT, padB: cell.padB!=null?cell.padB:size.padB,
    gap:isLoader?size.gapLoader:size.gap,
    width: cell.width || size.width,
    fill, border, textColor, textAlpha, containerOpacity, isLoader,
    cssOutline: outline && outline.width ? outline : null,
    outlineOffset: px((cell.outline||'').split('offset')[1]||'', 0),
    shadow: cell.shadow || null,
    stateNote: cell.note || null,
    spinner: cell.spinner || hexes(ldRow[T.loader?T.loader.headers[1]:'']||'')[0] || textColor,
    focus: (st.synthetic && st.id==='focus') ? M.FOCUS
         : (outline && outline.width ? {width:outline.width, color:outline.color, offset:px((cell.outline||'').split('offset')[1]||'',1)} : null),
    fontFamily:M.LABEL_FONT.family, fontWeight:M.LABEL_FONT.weight,
    tokenIds: [...new Set([].concat(fill.tokens||[], border.tokens||[], tokens(lbRow[T.label?T.label.headers[2]:'']||'')))],
    notes, size
  };
}

/* ============================================================================
   5. RENDERERS
   ========================================================================== */
const ICON_PLUS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>';
function chevronSVG(w,h){ return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 10 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 2.6L5 6l3.4-3.4"/></svg>'; }
function applyStyle(el,s){
  el.style.height = s.height+'px';
  if(s.fixedBox){ el.style.width = s.height+'px'; el.style.padding='0'; }

function defaultLabel(vid){

function buildNode(vid,sid,stateId,opts){
  opts = opts||{};
  const s = computeStyle(vid,sid,stateId,opts);
  const shape = M.META.preview;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:inline-flex;align-items:center;gap:9px';

  const el = document.createElement('div');
  el.className='btn'; el.dataset.state=stateId;

    const d = s.width || s.height || Math.max(14, Math.round(s.height*0.5));
    el.style.height = d+'px'; el.style.width = d+'px'; el.style.padding = '0';
    const round = /radio/.test(norm(M.META.name)) || (s.radius!=null && s.radius>=d/2);
    el.style.borderRadius = round ? '50%' : (s.radius!=null?s.radius:3)+'px';

      el.innerHTML = '<svg width="'+Math.round(d*0.62)+'" height="'+Math.round(d*0.62)+'" viewBox="0 0 16 16" fill="none" stroke="'+rgba(s.textColor,s.textAlpha)+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.4l3 3 6-6.6"/></svg>';
    }

    const lab = document.createElement('span');
    lab.textContent = opts.label!=null ? opts.label : defaultLabel(vid);

    wrap.appendChild(lab);

  }

  if(shape==='switch'){
    const parts = M.PARTS || {};
    const track = M.SIZES.find(x=>x.id===sid) || M.SIZES[0];
    const th = parts.thumb || {};
    const tw = s.width || track.width || 30, thh = s.height || 18;
    const thumbSize = th.width || Math.max(8, thh - 4);
    const inset = Math.max(1, Math.round((thh - thumbSize)/2));
    el.style.width = tw+'px'; el.style.height = thh+'px'; el.style.padding = '0';
    el.style.borderRadius = (s.radius!=null && s.radius<100 ? s.radius : thh/2)+'px';
    el.style.position = 'relative';
    const knob = document.createElement('span');
    const on = /active|on|checked/.test(vid);
    knob.style.cssText = 'position:absolute;top:'+inset+'px;border-radius:50%;transition:left .15s ease;'+
      'width:'+thumbSize+'px;height:'+thumbSize+'px;box-shadow:0 1px 2px rgba(0,0,0,.25);'+
      'background:'+((th.bg && hexes(th.bg)[0]) || '#FFFFFF')+';'+
      'left:'+(on ? (tw - inset - thumbSize) : inset)+'px';
    el.appendChild(knob);
    wrap.appendChild(el);
    const lab=document.createElement('span');
    lab.textContent = opts.label!=null ? opts.label : defaultLabel(vid);
    lab.style.cssText='font-size:'+s.font+'px;font-weight:'+s.fontWeight+';color:'+M.TEXT_FALLBACK+';font-family:"'+s.fontFamily+'",Inter,sans-serif';
    wrap.appendChild(lab);
    return wrap;
  }

  if(shape==='textarea'){
    const w = s.width || 390;
    el.style.width = opts.compact ? '100%' : w+'px';
    el.style.maxWidth = w+'px';
    el.style.height = (s.height || 70)+'px';
    el.style.alignItems = 'flex-start';
    el.style.justifyContent = 'flex-start';
    const t=document.createElement('span');
    t.textContent = opts.label!=null ? opts.label : defaultLabel(vid);
    t.style.opacity='.72';
    el.appendChild(t);
    wrap.appendChild(el);
    return wrap;
  }

  if(shape==='field'){
    const w = s.width || 220;
    el.style.width = opts.compact ? '100%' : w+'px';
    el.style.maxWidth = w+'px';
    if(opts.compact) wrap.style.width = '100%';
    el.style.justifyContent = 'flex-start';
    const t=document.createElement('span');
    t.textContent = opts.label!=null ? opts.label : defaultLabel(vid);
    t.style.opacity = '.72';
    el.appendChild(t);
    if(s.focus) el.style.outline = s.focus.width+'px solid '+s.focus.color;
    wrap.appendChild(el);
    return wrap;
  }

  /* default: box (buttons, chips, tags, popups) */
  if(s.isLoader){
    const sp = document.createElement('span'); sp.className='spin';
    sp.style.width=s.iconSize+'px'; sp.style.height=s.iconSize+'px';
    sp.style.borderWidth=Math.max(1.5,s.iconSize/8)+'px'; sp.style.color=s.spinner;
    el.appendChild(sp);
  } else {
    if(opts.icon){
      const ic=document.createElement('span');
      ic.style.cssText='display:block;width:'+s.iconSize+'px;height:'+s.iconSize+'px;flex:0 0 auto';
      ic.innerHTML=ICON_PLUS; ic.firstChild.setAttribute('width',s.iconSize); ic.firstChild.setAttribute('height',s.iconSize);
      el.appendChild(ic);
    }
    const t=document.createElement('span');
    t.textContent = opts.label!=null ? opts.label : defaultLabel(vid);
    el.appendChild(t);
    if(vid==='ziaoutline'){
      t.style.background='linear-gradient(90deg,#1471D9,#E21565)';
      t.style.webkitBackgroundClip='text'; t.style.backgroundClip='text'; t.style.color='transparent';
    }
    if(opts.chevron){
      const cw = sid==='default'?10:8, ch = sid==='default'?8:6;
      const c=document.createElement('span'); c.style.cssText='display:flex;align-items:center;flex:0 0 auto';
      c.innerHTML=chevronSVG(cw,ch); el.appendChild(c);
    }
  }
  if(opts.interactive && stateId==='default'){
    const set = st => applyStyle(el, computeStyle(vid,sid,st,opts));
    el.addEventListener('mouseenter',()=>set('hover'));
    el.addEventListener('mouseleave',()=>set('default'));
    el.addEventListener('mousedown', ()=>set('click'));
    el.addEventListener('mouseup',   ()=>set('hover'));

  wrap.appendChild(el);
  return wrap;
}
function buildLink(linkId, stateName){

const ICONS = {
  button:'<path d="M4 5l7 14 2-6 6-2z"/>', link:'<path d="M9.5 14.5l5-5M7 12l-2 2a3.5 3.5 0 105 5l2-2M17 12l2-2a3.5 3.5 0 10-5-5l-2 2"/>',
  field:'<path d="M4 7h16M4 12h10M4 17h16"/>', radio:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.4 12.2l2.5 2.5 4.7-5"/>',
  popup:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9.5h18"/>',
  toggle:'<rect x="2.5" y="7.5" width="19" height="9" rx="4.5"/><circle cx="16.5" cy="12" r="2.6" fill="currentColor" stroke="none"/>',

function iconFor(name){

  if(n.includes('radio'))  return ICONS.radio;
  if(n.includes('check'))  return ICONS.check;

    const parts=String(r[h[1]]).split('+').map(p=>p.trim());
    parts.slice().sort((a,b)=>(key(a)==='primary'?1:0)-(key(b)==='primary'?1:0)).forEach(p=>{
      const vid=key(p); if(M.I.bg[vid]) bar.appendChild(buildNode(vid,S.size,'default',{interactive:true}));
    });
    row.appendChild(bar); wrap.appendChild(row);
  });
  art.appendChild(wrap);
}
function renderLinkCanvas(art){
  if(S.mode==='single'){
    const stage=document.createElement('div'); stage.className='stage';
    stage.appendChild(buildLink(S.variant, S.state==='disabled'?'Disabled':S.state));
    art.appendChild(stage); return;
  }
  const cols = (M.LINKS[0]||{states:[]}).states.map(s=>s.state);
  const mx=document.createElement('div'); mx.className='mx';
  mx.style.gridTemplateColumns='max-content repeat('+cols.length+', minmax(150px,1fr))';
  mx.appendChild(document.createElement('div'));
  cols.forEach(c=>{ const h=document.createElement('div'); h.className='mx-col'; h.textContent=c; mx.appendChild(h); });
  M.LINKS.forEach((L,i)=>{
    if(i){ const sep=document.createElement('div'); sep.className='mx-rowsep'; mx.appendChild(sep); }
    const lb=document.createElement('div'); lb.className='mx-row-label'; lb.textContent=L.name; mx.appendChild(lb);
    cols.forEach(c=>{
      const cell=document.createElement('div');
      cell.className='mx-cell'+(L.id===S.variant && norm(c)===norm(S.state)?' on':'');
      cell.appendChild(buildLink(L.id,c));
      cell.onclick=()=>{ S.variant=L.id; S.state=norm(c); renderAll(); };
      mx.appendChild(cell);
    });
  });
  art.appendChild(mx);
}

/* ---------- inspector ---------- */
function grp(t, inner, right){
  return '<div class="grp"><div class="grp-t"><span class="cap">'+t+'</span>'+(right||'')+'</div>'+inner+'</div>';
}
function swatchHTML(s){
  if(s.fill.type==='gradient') return '<span class="sw grad" style="background:'+s.fill.css+'"></span>';
  if(s.fill.type==='solid')    return '<span class="sw" style="background:'+s.fill.colors[0]+'"></span>';
  return '<span class="sw" style="background:repeating-linear-gradient(45deg,#EEE,#EEE 3px,#FFF 3px,#FFF 6px)"></span>';
}
function renderInspector(){
  const b=$('inspBody');

      grp('Groups','<div class="tokens">'+(M.TOKENGROUPS||[]).map(g=>
        '<div class="trow"><span class="tk">'+g.title+'</span><span class="tv">'+g.rows.length+'</span></div>').join('')+'</div>') +

    $('tokFind').oninput = e => { S.tokenFilter = e.target.value; renderCanvas(); };

  const T=M.T, I=M.I;

  }

  /* ---- Inspect ---- */
  const sw = c => '<span class="sw" style="background:'+c+'"></span>';

    : s.fill.type==='solid' ? sw(s.fill.colors[0])+s.fill.colors[0] : 'transparent';
  const vr = I.variants[S.variant], vh = T.variants?T.variants.headers:[];
  const li = arr => '<ul>'+arr.map(x=>{ const m=/^([^-–—]+?)\s+[-–—]\s+(.*)$/.exec(x); return '<li>'+(m?'<b>'+m[1]+'</b> — '+m[2]:x)+'</li>'; }).join('')+'</ul>';
  const dos=M.RULES.do, donts=M.RULES.dont, notes=M.RULES.notes;

  b.innerHTML =
    grp('Computed · '+v.name+' · '+((M.STATES.find(x=>x.id===S.state)||{}).name||''),
      '<div class="kv"><span class="k">Fill</span><span class="v">'+fillTxt+'</span></div>'+
      '<div class="kv"><span class="k">Border</span><span class="v">'+(s.border.width?sw(s.border.color)+s.border.width+'px '+s.border.color+(s.border.opacity<1?' @'+s.border.opacity:''):'none')+'</span></div>'+
      '<div class="kv"><span class="k">Text</span><span class="v">'+sw(s.textColor)+s.textColor+(s.textAlpha<1?' @'+s.textAlpha:'')+'</span></div>'+
      (s.isLoader?'<div class="kv"><span class="k">Spinner</span><span class="v">'+sw(s.spinner)+s.spinner+'</span></div>':'')+
      (s.containerOpacity<1?'<div class="kv"><span class="k">Opacity</span><span class="v">'+s.containerOpacity+'</span></div>':'')+
      '<div class="kv"><span class="k">Typography</span><span class="v">'+s.fontFamily+' '+s.fontWeight+' '+s.font+'px</span></div>'+
      '<div class="kv"><span class="k">Focus ring</span><span class="v">'+M.FOCUS.width+'px '+M.FOCUS.color+' @'+M.FOCUS.offset+'px</span></div>') +
    grp('Raw markdown values',
      '<div class="kv"><span class="k">background</span><span class="v">'+esc(s.fill.raw)+'</span></div>'+
      '<div class="kv"><span class="k">border</span><span class="v">'+esc(s.border.raw||'None')+'</span></div>') +
    grp('Generated CSS','<pre class="code">'+cssFor(S.variant,S.size)+'</pre>','<button class="copy" id="copyIn">Copy</button>') +
    (function(){
      const spec = buildScopedSpec(S.variant,S.size);
      const full = estTokens(M.src), one = estTokens(spec);
      const pct = Math.round((1-one/full)*100);
      return grp('Scoped spec for AI',

        '≈'+one.toLocaleString()+' tokens instead of ≈'+full.toLocaleString()+' for the whole file '+
        '(<b>'+pct+'% less</b>). Colour values are the raw markdown strings, so nothing is lost in translation.</span></div>'+

  const ci=$('copyIn'); if(ci) ci.onclick=copyCSS;

function guidanceFor(vid){
  const vr = M.I.variants[vid];
  const usage = (vr && M.T.variants ? vr[M.T.variants.headers[2]] : '') || M.RULES.notes[0] || '';
  const dos = M.RULES.do;
  let extra = '';
  if(vid==='primary')  extra = dos.find(d=>/hierarchy|Primary/i.test(d))||'';
  if(vid==='negative') extra = dos.find(d=>/Destructive/i.test(d))||'';
  if(/outline|ghost/.test(vid)) extra = dos.find(d=>/Always pair/i.test(d))||'';
  return (usage||'No usage row for this variant in the markdown.') + (extra? ' '+extra : '');
}

/* ---------- CSS generation ---------- */
function cssFor(vid,sid){
  const v=M.VARIANTS.find(x=>x.id===vid);
  const cls='.'+norm(M.META.name).replace(/s$/,'')+'--'+vid;
  const base=computeStyle(vid,sid,'default',{chevron:S.chevron});
  const L=[]; const P=(k,val)=>L.push('  <span class="c-p">'+k+'</span>: <span class="c-v">'+val+'</span>;');
  L.push('<span class="c-s">/* '+v.name+' · '+base.size.name+' · generated from '+ACTIVE.file+' */</span>');
  L.push(cls+' {');
  P('display','inline-flex'); P('align-items','center'); P('justify-content','center');
  P('height',base.height+'px');
  if(base.width) P('max-width',base.width+'px');
  if(base.width && M.META.preview==='field') P('width','100%');
  P('padding',base.padT+'px '+base.padR+'px '+base.padB+'px '+base.padL+'px');
  P('gap',base.gap+'px'); P('border-radius',base.radius+'px');
  P('border',base.border.width?base.border.width+'px solid '+base.border.color:'none');
  P('background',base.fill.css);
  P('color',rgba(base.textColor,base.textAlpha));
  P('font',base.fontWeight+' '+base.font+'px/1 "'+base.fontFamily+'", sans-serif');
  P('cursor','pointer');
  L.push('}');
  [['hover',':hover'],['click',':active'],['disabled','[disabled]']].forEach(([st,sel])=>{
    const c=computeStyle(vid,sid,st,{chevron:S.chevron});
    L.push(cls+sel+' {');
    P('background',c.fill.css);
    if(c.border.width) P('border-color',rgba(c.border.color,c.border.opacity==null?1:c.border.opacity));
    if(c.textAlpha<1) P('color',rgba(c.textColor,c.textAlpha));
    if(c.containerOpacity<1) P('opacity',c.containerOpacity);
    L.push('}');
  });
  const ld=computeStyle(vid,sid,'loader',{});
  L.push(cls+'.is-loading {');
  P('background',ld.fill.css);
  if(ld.border.width) P('border-color',ld.border.color);
  P('color','transparent');
  L.push('}');
  L.push(cls+':focus-visible {');
  P('outline',M.FOCUS.width+'px solid '+M.FOCUS.color); P('outline-offset',M.FOCUS.offset+'px');
  L.push('}');
  return L.join('\n');
}
/* ---------- scoped spec: only what an AI needs for ONE variant ---------- */
function buildScopedSpec(vid, sid){
  const T=M.T, I=M.I;
  const v = M.VARIANTS.find(x=>x.id===vid);
  const size = M.SIZES.find(x=>x.id===sid);
  const bg=I.bg[vid]||{}, bd=I.border[vid]||{}, lb=I.label[vid]||{}, ld=I.loader[vid]||{};
  const L=[];
  L.push('# '+M.META.name+' — '+v.name);
  L.push(('> Source: '+ACTIVE.file+'.md '+(M.META.version||'')).trim()+' · scoped slice for one variant, not the full file');
  L.push('');
  L.push('## Container — '+v.name);
  L.push('');
  L.push('| State | Background | Border |');
  L.push('|---|---|---|');
  M.STATES.filter(st=>!st.synthetic).forEach(st=>{
    const c = (M.CELLS[vid]||{})[st.id] || {};
    L.push('| '+st.name+' | '+(c.bg||'(inherits Default)')+' | '+(c.border||'(inherits Default)')+
           (c.spinner?' spinner '+c.spinner:'')+' |');
  });
  L.push('');
  L.push('## Label');
  L.push('');
  L.push('| Property | Value |');
  L.push('|---|---|');
  L.push('| Color | '+(lb[T.label?T.label.headers[1]:''] || M.TEXT_FALLBACK)+' |');
  if(lb[T.label?T.label.headers[2]:'']) L.push('| Token | '+lb[T.label.headers[2]]+' |');
  L.push('| Font Family | '+M.LABEL_FONT.family+' |');
  L.push('| Font Weight | '+M.LABEL_FONT.weight+' |');
  L.push('| Line Height | '+M.LABEL_FONT.lineHeight+' |');
  L.push('');
  L.push('## Size — '+size.name);
  L.push('');
  L.push('| Property | Value |');
  L.push('|---|---|');
  L.push('| Height | '+size.height+'px |');
  if(size.width) L.push('| Max Width | '+size.width+'px |');
  L.push('| Corner Radius | '+size.radius+'px |');
  L.push('| Padding | '+size.padT+'px '+size.padR_plain+'px '+size.padB+'px '+size.padL+'px |');
  L.push('| Item Spacing | '+size.gap+'px |');
  L.push('| Font Size | '+size.font+'px |');
  L.push('| Icon Size | '+size.icon+'px |');
  L.push('| Focus Ring | '+M.FOCUS.width+'px '+M.FOCUS.color+' offset '+M.FOCUS.offset+'px |');
  const vr = I.variants[vid], vh = T.variants?T.variants.headers:[];
  if(vr){
    L.push('');
    L.push('## Usage');
    L.push('');
    L.push('- Emphasis: '+vr[vh[2]]);
    L.push('- Example label: '+vr[vh[1]]);
  }
  // cross-cutting rules — small, but they are what make the output correct
  const dos=M.RULES.do, donts=M.RULES.dont;
  if(dos.length){ L.push(''); L.push('## Do'); L.push(''); dos.forEach((d,i)=>L.push((i+1)+'. '+d)); }
  if(donts.length){ L.push(''); L.push("## Don't"); L.push(''); donts.forEach((d,i)=>L.push((i+1)+'. '+d)); }
  if(!dos.length && !donts.length && M.RULES.notes.length){
    L.push(''); L.push('## Usage rules'); L.push('');
    M.RULES.notes.forEach(d=>L.push('- '+d));
  }
  // only the grouping rows this variant actually appears in
  if(T.groups){
    const h=T.groups.headers;
    const rows = T.groups.obj.filter(r=>String(r[h[1]]).split('+').some(p=>key(p)===vid));
    if(rows.length){
      L.push(''); L.push('## Pairings for this variant'); L.push('');
      L.push('| Pattern | '+h[1]+' | '+h[2]+' |'); L.push('|---|---|---|');
      rows.forEach(r=>L.push('| '+r[h[0]]+' | '+r[h[1]]+' | '+r[h[2]]+' |'));
      const gr = section(M.DOC,'Button Group Rules');
      if(gr){ (gr.lines||[]).filter(l=>/^\s*[-*]\s+/.test(l)).forEach(l=>L.push(l.trim())); }
    }
  }
  return L.join('\n');
}
const estTokens = t => Math.round(t.length/4);
function copyScoped(btn){
  const spec = buildScopedSpec(S.variant, S.size);
  navigator.clipboard.writeText(spec).then(()=>{
    const t=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=t,1300);
  });
}
function plainCSS(){ return cssFor(S.variant,S.size).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&'); }
function copyCSS(){
  navigator.clipboard.writeText(plainCSS()).then(()=>{
    const b=$('btnCopyCss'); const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t,1200);
  });
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('modal').classList.remove('on'); });
$('findInput').oninput = e => { S.filter=e.target.value; renderNav(); };

(function(){ const l=document.createElement('link'); l.rel='icon'; l.href=document.querySelector('.logo').src; document.head.appendChild(l); })();

function renderAll(){
  renderNav(); renderCrumbs(); renderModes(); renderCanvas();
  $('tabs').querySelectorAll('button').forEach(t=>t.classList.toggle('on',t.dataset.tab===S.tab));
  $('tabs').style.display = (S.view==='links' || M.SHAPE==='tokens') ? 'none' : 'flex';
  renderInspector();
}

/* ---------- boot: load every .md baked into this file ----------
   Deferred to DOMContentLoaded so that .md <script> tags appended by a previous
   Export (which land at the end of <body>, after this script) are parsed first. */
function boot(){
  [...document.querySelectorAll('script[data-md]')].forEach(tag=>{
    registerMD(tag.getAttribute('data-md'), tag.textContent);
  });
  if(LIB.length) activate(LIB[0].id,'component');
  console.log('[Component Spec] library:', LIB.map(x=>x.name+' ('+x.model.VARIANTS.length+')').join(', '));
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
