<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Component Spec</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   DESIGN TOKENS

   Tier 1  PRIMITIVE — raw palette + scales. Never referenced by a rule.
   Tier 2  SEMANTIC  — role-based ("what is this for"). Rules consume these.
   Tier 3  COMPONENT — named layout dimensions and layer indices.

   Theming contract: a theme rebinds Tier 2 ONLY (see `.artboard.dark`).
   No rule below this block may contain a raw hex, px font-size, or literal
   z-index — if you need a new value, add it to a scale first.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* ─── Tier 1 · neutral ramp ─────────────────────────────────────────── */
  --gray-0:#FFFFFF;
  --gray-25:#FBFBFD;
  --gray-50:#FAFAFC;
  --gray-75:#F7F8FA;
  --gray-100:#F2F3F7;
  --gray-125:#F4F5F8;
  --gray-150:#F6F7FA;
  --gray-175:#EDEEF3;
  --gray-200:#E8E9EE;
  --gray-225:#F0F1F5;
  --gray-250:#DFE1EA;
  --gray-275:#DCDEE7;
  --gray-300:#D7D9E2;
  --gray-325:#CFD3E6;
  --gray-350:#C8CBD6;
  --gray-375:#C3C7D3;
  --gray-400:#C2C5D2;
  --gray-450:#A9AEC0;
  --gray-500:#8A90A0;
  --gray-600:#4B5162;
  --gray-700:#5C6479;
  --gray-800:#2A2F3C;
  --gray-850:#262B36;
  --gray-875:#20242E;
  --gray-900:#181B23;
  --gray-950:#14161C;
  --canvas-25:#FBFBFC;   /* page ground — a hair cooler than gray-25 */
  --canvas-50:#FCFCFD;   /* card ground inside the artboard */
  --ondark-300:#C9CDD8;  /* primary text on the dark artboard */
  --ondark-400:#D7DBE8;  /* code text on near-black */

  /* ─── Tier 1 · brand + accent ───────────────────────────────────────── */
  --brand-500:#4A59F0;
  --accent-100:#EEF0FE;
  --accent-200:#C9CFFB;
  --accent-500:#5464F2;
  --accent-600:#4351E8;
  --accent-alpha-11:rgba(84,100,242,.11);
  --accent-alpha-12:rgba(84,100,242,.12);

  /* ─── Tier 1 · status ───────────────────────────────────────────────── */
  --warn-100:#FFF8E6;
  --warn-200:#F3DFA5;
  --warn-500:#C48A16;
  --warn-700:#8A6410;
  --positive-500:#16A34A;
  --negative-500:#EF4444;
  --syntax-prop:#93A3FF;
  --syntax-value:#7FE3B1;

  /* ─── Tier 1 · scrim + shadow alphas ────────────────────────────────── */
  --alpha-hairline:rgba(0,0,0,.14);
  --alpha-drop:rgba(0,0,0,.22);
  --alpha-seg:rgba(20,24,36,.14);
  --alpha-sheet:rgba(10,14,26,.5);
  --alpha-scrim:rgba(15,18,28,.44);

  /* ─── Tier 1 · type scale ───────────────────────────────────────────── */
  --fs-50:10.5px;   /* caps / tags        */
  --fs-75:11px;     /* fine print         */
  --fs-100:11.5px;  /* mono meta          */
  --fs-200:12px;    /* dense controls     */
  --fs-300:12.5px;  /* body small         */
  --fs-400:13px;    /* body               */
  --fs-500:13.5px;  /* nav / tabs         */
  --fs-600:14px;    /* rendered component */
  --fs-700:15px;    /* brand              */
  --fs-800:20px;    /* artboard title     */

  --fw-normal:500;
  --fw-medium:540;
  --fw-semibold:600;
  --fw-bold:640;
  --fw-heavy:700;

  --lh-tight:1.45;
  --lh-normal:1.55;
  --lh-loose:1.65;
  --track-tight:-.02em;
  --track-brand:-.015em;
  --track-caps:.09em;
  --track-wide:.04em;

  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --font-component:"Zoho Puvi","Inter",-apple-system,"Segoe UI",Roboto,sans-serif;

  /* ─── Tier 1 · space scale (matches the existing 2px-step rhythm) ───── */
  --sp-1:2px;   --sp-2:4px;   --sp-3:6px;   --sp-4:8px;
  --sp-5:10px;  --sp-6:12px;  --sp-7:14px;  --sp-8:16px;
  --sp-9:18px;  --sp-10:20px; --sp-11:22px; --sp-12:24px;
  --sp-13:26px; --sp-14:30px; --sp-16:40px; --sp-20:60px;

  /* ─── Tier 1 · radius scale ─────────────────────────────────────────── */
  --r-2xs:2px; --r-xs:4px;  --r-sm:6px;   --r-md:8px;
  --r-lg:10px; --r-xl:12px; --r-2xl:14px; --r-full:999px;

  /* ─── Tier 1 · motion ───────────────────────────────────────────────── */
  --dur-fast:.12s;
  --dur-base:.14s;
  --dur-slow:.16s;

  /* ─── Tier 1 · elevation ────────────────────────────────────────────── */
  --elev-1:0 1px 2px var(--alpha-seg);
  --elev-2:0 1px 2px var(--alpha-drop);
  --elev-modal:0 26px 70px -20px var(--alpha-sheet);

  /* ═══ Tier 2 · SEMANTIC — the only layer a theme rebinds ═════════════ */
  /* surface */
  --surface-page:var(--canvas-25);
  --surface-panel:var(--gray-0);
  --surface-sunken:var(--gray-25);
  --surface-card:var(--canvas-50);
  --surface-hover:var(--gray-75);
  --surface-hover-strong:var(--gray-100);
  --surface-zebra:var(--gray-50);
  --surface-track:var(--gray-175);
  --surface-tag:var(--gray-125);
  --surface-chip:var(--gray-150);
  --surface-code:var(--gray-950);
  /* border */
  --border-default:var(--gray-200);
  --border-subtle:var(--gray-225);
  --border-strong:var(--gray-275);
  --border-hover:var(--gray-325);
  /* content */
  --content-primary:var(--gray-950);
  --content-secondary:var(--gray-600);
  --content-muted:var(--gray-500);
  --content-inverse:var(--gray-0);
  --content-separator:var(--gray-375);
  --content-code:var(--ondark-400);
  /* interactive */
  --interactive:var(--accent-500);
  --interactive-hover:var(--accent-600);
  --interactive-subtle:var(--accent-100);
  --interactive-border:var(--accent-200);
  --ring-focus:0 0 0 3px var(--accent-alpha-12);
  --ring-select:0 0 0 3px var(--accent-alpha-11);
  /* form control */
  --control-track:var(--gray-250);
  --control-border:var(--gray-350);
  --control-border-hover:var(--gray-450);
  --control-knob:var(--gray-0);
  /* scrollbar */
  --scrollbar-thumb:var(--gray-300);
  --scrollbar-thumb-hover:var(--gray-400);

  /* ═══ Tier 3 · COMPONENT dimensions ══════════════════════════════════ */
  --topbar-h:56px;
  --rail-w:286px;
  --insp-w:392px;
  --sheet-head-h:52px;
  --control-h:34px;      /* text inputs                */
  --control-h-sm:31px;   /* topbar buttons             */
  --control-h-xs:29px;   /* chips                      */
  /* canonical component slot — every matrix cell is this wide, for every
     component, so Button / Text Field / Dropdown all line up identically.
     Sized for the widest planned component (Text Field @ 390px). */
  --slot:390px;

  /* ═══ Tier 3 · z-index layers (never write a bare number) ════════════ */
  --z-rowlabel:2;
  --z-colhead:3;
  --z-corner:4;
  --z-topbar:30;
  --z-modal:80;

  /* ─── Aliases consumed by JS-generated markup — do not rename ──────── */
  --sans:var(--font-sans);

  /* ─── Brand mark ────────────────────────────────────────────────────── */
  --brand:var(--brand-500);
}

/* Dark artboard rebinds Tier 2 only; every rule below stays theme-agnostic. */
.artboard.dark{
  --surface-panel:var(--gray-900);
  --surface-hover:var(--gray-875);
  --border-default:var(--gray-800);
  --border-subtle:var(--gray-850);
  --content-primary:var(--ondark-300);
  --content-secondary:var(--gray-500);
}

/* ═══════════════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-page);color:var(--content-primary);font-family:var(--font-sans);
  font-size:var(--fs-400);line-height:var(--lh-tight);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:var(--r-md);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:flex;flex-direction:column}
.body{flex:1;display:flex;min-height:0}
.spacer{flex:1}
.cap{font-size:var(--fs-50);font-weight:var(--fw-heavy);letter-spacing:var(--track-caps);
  text-transform:uppercase;color:var(--content-muted)}

/* ═══════════════════════════════════════════════════════════════════════
   TOP BAR
   ═══════════════════════════════════════════════════════════════════════ */
.topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;gap:var(--sp-8);
  padding:0 var(--sp-9);background:var(--surface-panel);border-bottom:1px solid var(--border-default);
  z-index:var(--z-topbar);
}
.brand{display:flex;align-items:center;gap:var(--sp-5);font-weight:var(--fw-heavy);
  font-size:var(--fs-700);letter-spacing:var(--track-brand)}
.logo{display:grid;place-items:center;color:var(--brand);flex:0 0 auto}
.logo svg{width:27px;height:18px;display:block}
.divider{width:1px;height:var(--sp-11);background:var(--border-default)}
.crumbs{display:flex;align-items:center;gap:var(--sp-4);color:var(--content-secondary);font-weight:var(--fw-medium)}
.crumbs .sep{color:var(--content-separator);display:flex}
.crumbs .cur{color:var(--interactive);font-weight:var(--fw-bold)}
.tbtn{height:var(--control-h-sm);padding:0 var(--sp-6);border:1px solid var(--border-default);
  background:var(--surface-panel);border-radius:var(--r-md);color:var(--content-secondary);
  cursor:pointer;display:inline-flex;align-items:center;gap:var(--sp-3);transition:var(--dur-base);
  font-size:var(--fs-300);font-weight:var(--fw-medium)}
.tbtn:hover{background:var(--surface-hover);border-color:var(--border-strong);color:var(--content-primary)}
.tbtn.primary{background:var(--interactive);border-color:var(--interactive);color:var(--content-inverse)}
.tbtn.primary:hover{background:var(--interactive-hover);border-color:var(--interactive-hover)}

/* ═══════════════════════════════════════════════════════════════════════
   LIBRARY RAIL
   ═══════════════════════════════════════════════════════════════════════ */
.rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--surface-panel);
  border-right:1px solid var(--border-default);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-8) var(--sp-9) var(--sp-5)}
.icon-btn{width:var(--sp-11);height:var(--sp-11);border:0;background:transparent;color:var(--content-muted);
  cursor:pointer;display:grid;place-items:center;border-radius:var(--r-sm)}
.icon-btn:hover{background:var(--surface-hover-strong);color:var(--content-secondary)}
.search{position:relative;padding:0 var(--sp-7) var(--sp-6)}
.search svg{position:absolute;left:var(--sp-12);top:9px;color:var(--content-muted)}
.search input{width:100%;height:var(--control-h);border:1px solid var(--border-default);border-radius:var(--r-md);
  background:var(--surface-sunken);padding:0 var(--sp-5) 0 32px;outline:0;transition:var(--dur-base)}
.search input:focus{border-color:var(--interactive);box-shadow:var(--ring-focus);background:var(--surface-panel)}
.rail-scroll{flex:1;overflow-y:auto;padding:0 var(--sp-5) var(--sp-6)}
.nav-item{display:flex;align-items:center;gap:var(--sp-6);padding:var(--sp-5) var(--sp-5);border-radius:var(--r-md);
  cursor:pointer;color:var(--content-secondary);transition:var(--dur-fast);user-select:none;
  font-weight:var(--fw-medium);font-size:var(--fs-500);margin-bottom:var(--sp-1)}
.nav-item:hover{background:var(--surface-hover)}
.nav-item.active{background:var(--interactive-subtle);color:var(--interactive);font-weight:var(--fw-bold);
  box-shadow:inset 0 0 0 1px var(--interactive-border)}
.nav-item.locked{opacity:.55}
.nav-ico{width:var(--sp-9);height:var(--sp-9);display:grid;place-items:center;flex:0 0 var(--sp-9)}
.nav-dot{margin-left:auto;width:var(--sp-3);height:var(--sp-3);border-radius:50%;background:var(--interactive)}
.nav-tag{margin-left:auto;font-size:var(--fs-50);font-family:var(--font-mono);color:var(--content-muted);
  background:var(--surface-tag);border:1px solid var(--border-default);border-radius:var(--r-sm);padding:1px var(--sp-3)}
.rail-foot{border-top:1px solid var(--border-default);padding:var(--sp-6) var(--sp-9);
  color:var(--content-muted);font-size:var(--fs-75);line-height:var(--lh-loose)}
.rail-foot b{color:var(--content-secondary);font-weight:var(--fw-bold)}

/* ═══════════════════════════════════════════════════════════════════════
   CANVAS
   ═══════════════════════════════════════════════════════════════════════ */
.canvas-wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface-page);overflow:auto}
.canvas-inner{padding:var(--sp-13) var(--sp-14) var(--sp-20);min-width:max-content}
.art-head{display:flex;align-items:flex-start;gap:var(--sp-8);margin-bottom:var(--sp-10)}
.art-title{font-size:var(--fs-800);font-weight:var(--fw-heavy);letter-spacing:var(--track-tight)}
.art-sub{color:var(--content-muted);font-size:var(--fs-400);margin-top:var(--sp-1)}
.zoom{margin-left:auto;display:flex;gap:var(--sp-4);align-items:center}
.chip{height:var(--control-h-xs);display:inline-flex;align-items:center;padding:0 var(--sp-6);
  border:1px solid var(--border-default);border-radius:var(--r-md);background:var(--surface-panel);
  color:var(--content-secondary);font-size:var(--fs-200);font-weight:var(--fw-medium);white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-track);border-radius:var(--r-md);padding:3px;gap:var(--sp-1)}
.seg button{border:0;background:transparent;padding:0 var(--sp-6);height:25px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--content-secondary);font-size:var(--fs-200);font-weight:var(--fw-medium);
  transition:var(--dur-base);white-space:nowrap}
.seg button:hover{color:var(--content-primary)}
.seg button.on{background:var(--surface-panel);color:var(--content-primary);box-shadow:var(--elev-1)}

.artboard{background:var(--surface-panel);border:1px solid var(--border-default);border-radius:var(--r-2xl);
  padding:var(--sp-13) var(--sp-14) var(--sp-14);display:inline-block;min-width:100%}

/* ═══════════════════════════════════════════════════════════════════════
   MATRIX
   Frozen header row + frozen label column. Both must be fully opaque, so:
   - no grid gap (a gap is transparent and scrolling content shows through)
   - sticky items stretch to fill their whole track, not just their text box
   Stacking: corner > header row > label column > cells.
   ═══════════════════════════════════════════════════════════════════════ */
.mx{display:grid;gap:0;align-items:center}
.mx-col{font-size:var(--fs-50);font-weight:var(--fw-heavy);letter-spacing:var(--track-caps);
  text-transform:uppercase;color:var(--content-muted);text-align:center;padding:var(--sp-3) var(--sp-4) var(--sp-7);
  position:sticky;top:0;z-index:var(--z-colhead);background:var(--surface-panel);
  box-shadow:0 1px 0 var(--border-subtle)}
.mx-corner{position:sticky;left:0;top:0;z-index:var(--z-corner);background:var(--surface-panel);
  box-shadow:1px 1px 0 var(--border-subtle);align-self:stretch}
.mx-row-label{font-size:var(--fs-400);font-weight:var(--fw-bold);color:var(--content-primary);white-space:nowrap;
  padding:0 var(--sp-8) 0 var(--sp-1);position:sticky;left:0;z-index:var(--z-rowlabel);
  background:var(--surface-panel);box-shadow:1px 0 0 var(--border-subtle);
  align-self:stretch;display:flex;align-items:center}
.mx-cell{display:flex;align-items:center;justify-content:center;padding:9px var(--sp-4);
  border-radius:var(--r-md);cursor:pointer;transition:var(--dur-fast)}
/* the component sits centered inside a fixed slot, identical across components */
.mx-cell>*{flex:0 0 auto;max-width:var(--slot)}
.mx-cell:hover{background:var(--surface-hover)}
.mx-cell.on{background:var(--interactive-subtle);box-shadow:inset 0 0 0 1px var(--interactive-border)}
.mx-rowsep{grid-column:1/-1;height:1px;background:var(--border-subtle)}

/* ═══════════════════════════════════════════════════════════════════════
   SINGLE PREVIEW — same slot geometry as a matrix cell
   ═══════════════════════════════════════════════════════════════════════ */
.stage{display:flex;align-items:center;justify-content:center;min-height:360px;width:var(--slot);margin:0 auto}
.frame{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.sel{position:absolute;inset:-1px;border:1px solid var(--interactive);pointer-events:none}
.handle{position:absolute;width:7px;height:7px;background:var(--surface-panel);
  border:1px solid var(--interactive);border-radius:var(--r-2xs)}
.handle.tl{left:-4px;top:-4px}.handle.tr{right:-4px;top:-4px}
.handle.bl{left:-4px;bottom:-4px}.handle.br{right:-4px;bottom:-4px}
.dim{position:absolute;left:50%;transform:translateX(-50%);bottom:-27px;background:var(--interactive);
  color:var(--content-inverse);font-size:var(--fs-75);font-weight:var(--fw-bold);padding:var(--sp-1) var(--sp-3);
  border-radius:var(--r-xs);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════════════════════════════
   GROUPS + SIZES
   ═══════════════════════════════════════════════════════════════════════ */
.stack{display:flex;flex-direction:column;gap:var(--sp-7)}
.group-row{border:1px solid var(--border-default);border-radius:var(--r-xl);padding:var(--sp-8) var(--sp-9);
  display:flex;flex-direction:column;gap:var(--sp-7);background:var(--surface-card)}
.group-head{display:flex;align-items:baseline;gap:var(--sp-5)}
.group-title{font-weight:var(--fw-bold)}
.group-use{font-size:var(--fs-100);color:var(--content-muted)}
.group-btns{display:flex;gap:var(--sp-4);flex-wrap:wrap}
.size-row{display:flex;gap:var(--sp-9);flex-wrap:wrap}
.size-card{border:1px solid var(--border-default);border-radius:var(--r-xl);
  padding:var(--sp-11) var(--sp-13) var(--sp-7);display:flex;flex-direction:column;align-items:center;
  gap:var(--sp-7);cursor:pointer;transition:var(--dur-base);background:var(--surface-card);min-width:170px}
.size-card:hover{border-color:var(--border-hover)}
.size-card.on{border-color:var(--interactive);box-shadow:var(--ring-select);background:var(--surface-panel)}
.size-meta{text-align:center}
.size-meta b{display:block;font-size:var(--fs-400)}
.size-meta span{font-size:var(--fs-75);color:var(--content-muted)}

/* ═══════════════════════════════════════════════════════════════════════
   INSPECTOR
   ═══════════════════════════════════════════════════════════════════════ */
.insp{width:var(--insp-w);flex:0 0 var(--insp-w);background:var(--surface-panel);
  border-left:1px solid var(--border-default);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--border-default);padding:0 var(--sp-12)}
.tabs button{flex:1;border:0;background:transparent;padding:var(--sp-8) 0 var(--sp-7);cursor:pointer;
  color:var(--content-muted);font-weight:var(--fw-semibold);font-size:var(--fs-500);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:var(--dur-base)}
.tabs button:hover{color:var(--content-secondary)}
.tabs button.on{color:var(--interactive);border-bottom-color:var(--interactive)}
.insp-scroll{flex:1;overflow-y:auto;padding:var(--sp-10) var(--sp-12) var(--sp-16)}
.grp{margin-bottom:var(--sp-13)}
.grp-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-6)}
.grp-t .link{color:var(--interactive);font-size:var(--fs-100);font-weight:var(--fw-semibold);cursor:pointer;
  text-transform:none;letter-spacing:0}
.grp-t .link:hover{text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:var(--sp-4)}
.pill{border:1px solid var(--border-default);background:var(--surface-panel);border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-7);cursor:pointer;color:var(--content-secondary);font-size:var(--fs-300);
  transition:var(--dur-fast);font-weight:var(--fw-medium);white-space:nowrap}
.pill:hover{border-color:var(--border-hover);background:var(--surface-zebra)}
.pill.on{background:var(--interactive-subtle);border-color:var(--interactive-border);
  color:var(--interactive);font-weight:var(--fw-bold)}
.radios{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-6) var(--sp-4)}
.radio{display:flex;align-items:center;gap:var(--sp-4);cursor:pointer;color:var(--content-secondary);
  font-size:var(--fs-400);user-select:none;white-space:nowrap}
.radio i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--control-border);flex:0 0 15px;

<script type="text/plain" id="md-Buttons"># Buttons
> Category: Components / Atoms > Version: v2.0.0

Buttons allow users to take actions, and make choices, with a single tap. They communicate actions and are typically placed throughout your UI in places like dialogs, forms, toolbars, and cards.

---

## Anatomy

The visual breakdown and structure of the standard CRM Button component, with full color token references per layer.

### Container Layer

| Part | Description |
|---|---|
| Type | Frame with Horizontal Auto Layout |
| Corner Radius | 6px (Default), 4px (Small, Extreme Small) |
| Border | 0px (filled/ghost buttons), 1px (outline/default buttons) |
| Height | 32px (Default), 27px (Small), 19px (Extreme Small) |
| Clip Content | Yes |

| Outline Blue | Solid #F0F1FF (token 90298:1110) | Solid #E5E8FF (token 90298:1112) | Solid #E5E8FF (token 90298:1112) | #F0F1FF opacity 0.6 (token 90298:1111) |

## Variants

| Variant | Example Label | Usage | Fill Type | Border |
|---|---|---|---|---|
| Primary | Create | High emphasis. For major actions. | Gradient (blue) | None |
| Default | Cancel | Secondary / neutral actions. | Gradient (white→gray) | 1px solid |
| Success | Accept | Confirmations, positive outcomes. | Gradient (green) | None |
| Negative | Delete | Destructive or irreversible actions. | Gradient (red) | None |
| Warning | Maybe | Caution / secondary actions. | Gradient (orange) | None |
| Outline Blue | Reinvite | Medium emphasis, clear bounds. | Solid tinted | 1px solid blue |
| Outline Green | Accept | Positive confirmation actions. | Solid tinted | 1px solid green |
| Outline Red | Delete | Outlined destructive actions. | Solid tinted | 1px solid red |
| Outline Orange | Maybe | Outlined warning actions. | Solid tinted | 1px solid orange |
| Ghost Blue | Assign | Low emphasis, quiet context actions. | Transparent/tinted | None |
| Ghost Red | Delete | Low emphasis destructive actions. | Transparent/tinted | None |
| Zia Fill | Generate | Primary AI-powered action. | Gradient (blue→pink) | None |
| Zia Outline | Reinvite | Secondary AI action. | Gradient tinted | 1px gradient |

## Usage Guidelines

### Do

1. Maintain clear hierarchy - Use one Primary action per screen space. Accompany with Default or Ghost buttons for secondary actions.
2. Use concise, active verbs - Label buttons with explicit CRM actions like "Create Lead", "Export CSV", or "Send Invite".
3. Always pair Primary with Default - Every Primary Button should have a Default "escape" nearby (Cancel, Close, Back).
4. Use Loading state for async - Always show Loading state during API calls, file uploads, and data processing.
5. Size consistency in groups - All buttons in the same row must use the same size tier.
6. Reference design tokens - Always use token IDs, never hardcode hex values.
7. Destructive actions need confirmation - Negative buttons should trigger a confirmation dialog.

### Don't

1. Avoid multiple competing primary actions - Multiple primary buttons side-by-side causes action confusion.
2. Avoid vague passive labels - Avoid "Click Here" or "Proceed". Use descriptive labels.
3. Don't use Negative for Cancel - Cancel is Default variant. Negative is ONLY for destructive actions.
4. Don't mix button sizes - Never combine 32px, 27px, and 19px in the same group.
5. Don't create custom colors - Only use approved variant tokens.
6. Don't use Extreme Small as primary CTA - 19px buttons for dense desktop UIs only.
7. Don't remove focus indicators - Keyboard accessibility requires visible focus rings.

  const lc = parseColor(lbRow[T.label?T.label.headers[1]:'']||'');

const ICON_PLUS = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>';

function applyStyle(el,s){
  el.style.height = s.height+'px';
  el.style.padding = s.padT+'px '+s.padR+'px '+s.padB+'px '+s.padL+'px';
  el.style.borderRadius = s.radius+'px';
  el.style.fontSize = s.font+'px';
  el.style.fontWeight = s.fontWeight;
  el.style.gap = s.gap+'px';
  el.style.background = s.fill.css;
  el.style.backgroundOrigin = 'padding-box';
  el.style.backgroundClip = 'border-box';
  el.style.color = rgba(s.textColor, s.textAlpha);
  el.style.opacity = s.containerOpacity;
  if(s.border.width){
    el.style.borderWidth = s.border.width+'px';
    el.style.borderColor = rgba(s.border.color, s.border.opacity==null?1:s.border.opacity);
    if(s.border.gradient){
      el.style.borderColor = 'transparent';
      el.style.backgroundImage = s.fill.css+', linear-gradient(90deg,'+s.border.colors.join(',')+')';
      el.style.backgroundOrigin = 'border-box';
      el.style.backgroundClip = 'padding-box, border-box';
    }
  } else { el.style.borderWidth='0px'; el.style.borderColor='transparent'; }

  el.style.outlineOffset = s.focus ? s.focus.offset+'px' : '0';
}
function defaultLabel(vid){

}
function buildButton(vid,sid,stateId,opts){
  opts = opts||{};

  const el = document.createElement('div');
  el.className='btn'; el.dataset.state=stateId;
  applyStyle(el,s);
  if(s.isLoader){
    const sp = document.createElement('span'); sp.className='spin';
    sp.style.width=s.iconSize+'px'; sp.style.height=s.iconSize+'px';
    sp.style.borderWidth=Math.max(1.5,s.iconSize/8)+'px'; sp.style.color=s.spinner;
    el.appendChild(sp);
  } else {
    if(opts.icon){
      const ic=document.createElement('span');
      ic.style.cssText='display:block;width:'+s.iconSize+'px;height:'+s.iconSize+'px;flex:0 0 auto';
      ic.innerHTML=ICON_PLUS; ic.firstChild.setAttribute('width',s.iconSize); ic.firstChild.setAttribute('height',s.iconSize);
      el.appendChild(ic);
    }
    const t=document.createElement('span');

    el.appendChild(t);
    if(vid==='ziaoutline'){
      t.style.background='linear-gradient(90deg,#1471D9,#E21565)';
      t.style.webkitBackgroundClip='text'; t.style.backgroundClip='text'; t.style.color='transparent';
    }
    if(opts.chevron){
      const cw = sid==='default'?10:8, ch = sid==='default'?8:6;
      const c=document.createElement('span'); c.style.cssText='display:flex;align-items:center;flex:0 0 auto';
      c.innerHTML=chevronSVG(cw,ch); el.appendChild(c);
    }
  }
  if(opts.interactive && stateId==='default'){
    const set = st => applyStyle(el, computeStyle(vid,sid,st,opts));
    el.addEventListener('mouseenter',()=>set('hover'));
    el.addEventListener('mouseleave',()=>set('default'));
    el.addEventListener('mousedown', ()=>set('click'));
    el.addEventListener('mouseup',   ()=>set('hover'));

/* --- links, parsed from ## Links --- */
const LINKS = (function(){
  const s = section(DOC,'Links');
  if(!s) return [];
  return s.children.filter(c=>c.tables.length).map(c=>{
    const h = c.tables[0].headers;
    return {id:key(c.title), name:c.title, states:c.tables[0].obj.map(r=>({
      state:r[h[0]], color:parseColor(r[h[1]]), token:r[h[2]], deco:r[h[3]]
    }))};
  });
})();
/* Decoration cells read "Underlined" / "No underline" / "No underline, opacity 0.6".
   A bare /underlin/ test matches the negated form too, so negations must win. */
const isUnderlined = d => /underlin/i.test(d||'') && !/\b(no|none|without|never)\b/i.test(d||'');
function buildLink(linkId, stateName){
  const L = LINKS.find(l=>l.id===linkId)||LINKS[0];
  if(!L) return document.createTextNode('');
  const row = L.states.find(s=>norm(s.state)===norm(stateName)) || L.states[0];
  const a = document.createElement('span');
  a.className='lnk'; a.textContent = 'View all leads';
  a.style.color = rgba(row.color.hex||'#5464F2', row.color.opacity);
  a.style.textDecoration = isUnderlined(row.deco) ? 'underline' : 'none';
  a.style.textUnderlineOffset='2px';
  return a;
}

    grp('Raw markdown values',
      '<div class="kv"><span class="k">background</span><span class="v">'+esc(s.fill.raw)+'</span></div>'+
      '<div class="kv"><span class="k">border</span><span class="v">'+esc(s.border.raw||'None')+'</span></div>') +
    grp('Generated CSS','<pre class="code">'+cssFor(S.variant,S.size)+'</pre>','<button class="copy" id="copyIn">Copy</button>') +
    (vr ? grp('Usage',
      '<div class="kv"><span class="k">Emphasis</span><span class="v" style="font-family:var(--sans);font-size:12.2px">'+vr[vh[2]]+'</span></div>'+
      '<div class="kv"><span class="k">Fill type</span><span class="v">'+vr[vh[3]]+'</span></div>'+
      '<div class="kv"><span class="k">Border</span><span class="v">'+vr[vh[4]]+'</span></div>') : '') +
    grp('Do','<div class="doc do">'+li(numbered(doNode))+'</div>') +
    grp("Don't",'<div class="doc dont">'+li(numbered(dontNode))+'</div>') +
    (WARN.length ? grp('MD lint', WARN.map(w=>'<div class="callout plain"><span><b>'+w.raw+'</b> → '+w.fixed+' · '+w.why+'</span></div>').join('')) : '');
  const ci=$('copyIn'); if(ci) ci.onclick=copyCSS;
}
function guidanceFor(vid){
  const vr = I.variants[vid];
  const usage = vr ? vr[T.variants.headers[2]] : '';
  const doNode = section(DOC,'Do');
  const dos = (doNode?doNode.lines:[]).filter(l=>/^\s*\d+\.\s+/.test(l)).map(l=>l.replace(/^\s*\d+\.\s+/,''));
  let extra = '';
  if(vid==='primary')  extra = dos.find(d=>/hierarchy|Primary/i.test(d))||'';
  if(vid==='negative') extra = dos.find(d=>/Destructive/i.test(d))||'';
  if(/outline|ghost/.test(vid)) extra = dos.find(d=>/Always pair/i.test(d))||'';
  return usage + (extra? ' ' + extra : '');
}
function renderLinkInspector(b){
  const L = LINKS.find(l=>l.id===S.variant)||LINKS[0];
  if(!L){ b.innerHTML='<div class="callout plain">No Links section found in the markdown.</div>'; return; }
  if(S.tab==='inspect') return renderLinkInspect(b,L);
  b.innerHTML =
    grp('Variant Select','<div class="pills">'+LINKS.map(l=>'<span class="pill'+(l.id===S.variant?' on':'')+'" data-lv="'+l.id+'">'+l.name+'</span>').join('')+'</div>') +
    grp('Interactive State','<div class="radios">'+L.states.map(s=>'<span class="radio'+(norm(s.state)===S.state?' on':'')+'" data-ls="'+norm(s.state)+'"><i></i>'+s.state+'</span>').join('')+'</div>') +
    grp('Token Mapping','<div class="tokens">'+L.states.map(s=>
      '<div class="trow"><span class="tk">'+norm(s.state)+'</span><span class="tv hex"><span class="sw" style="background:'+(s.color.hex||'#000')+'"></span>'+(s.color.hex||'—')+'</span></div>'+
      '<div class="trow"><span class="tk">'+norm(s.state)+'-decoration</span><span class="tv">'+s.deco+'</span></div>').join('')+'</div>'+
      '<div class="tokchips">'+[...new Set(L.states.map(s=>s.token))].map(t=>'<span class="tok">'+t+'</span>').join('')+'</div>');
  b.querySelectorAll('[data-lv]').forEach(e=>e.onclick=()=>{S.variant=e.dataset.lv;renderAll();});
  b.querySelectorAll('[data-ls]').forEach(e=>e.onclick=()=>{S.state=e.dataset.ls;renderAll();});
}
/* Inspect tab for Links — mirrors the Button inspect panel: computed values,
   the untouched markdown cells they came from, generated CSS, and guidance. */
function renderLinkInspect(b,L){
  const row = L.states.find(s=>norm(s.state)===norm(S.state)) || L.states[0];
  const sw = c => '<span class="sw" style="background:'+c+'"></span>';
  const hex = row.color.hex || '—';
  const col = rgba(row.color.hex||'#5464F2', row.color.opacity);
  const doNode=section(DOC,'Do'), dontNode=section(DOC,"Don't");
  const numbered = n => (n?n.lines:[]).filter(l=>/^\s*\d+\.\s+/.test(l)).map(l=>l.replace(/^\s*\d+\.\s+/,''));
  const li = arr => '<ul>'+arr.map(x=>{ const m=/^([^-–—]+?)\s+[-–—]\s+(.*)$/.exec(x); return '<li>'+(m?'<b>'+m[1]+'</b> — '+m[2]:x)+'</li>'; }).join('')+'</ul>';

  b.innerHTML =
    grp('Computed · '+L.name+' · '+row.state,
      '<div class="kv"><span class="k">Color</span><span class="v">'+sw(col)+hex+(row.color.opacity<1?' @'+row.color.opacity:'')+'</span></div>'+
      '<div class="kv"><span class="k">Token</span><span class="v">'+esc(row.token||'—')+'</span></div>'+
      '<div class="kv"><span class="k">Decoration</span><span class="v">'+esc(row.deco||'None')+'</span></div>'+
      '<div class="kv"><span class="k">Typography</span><span class="v">Zoho Puvi 500 14px</span></div>'+
      '<div class="kv"><span class="k">Underline offset</span><span class="v">2px</span></div>'+
      '<div class="kv"><span class="k">Focus ring</span><span class="v">'+FOCUS.width+'px '+FOCUS.color+' @'+FOCUS.offset+'px</span></div>') +
    grp('All states · '+L.name,'<div class="tokens">'+L.states.map(s=>
      '<div class="trow"><span class="tk">'+norm(s.state)+'</span><span class="tv hex">'+
      '<span class="sw" style="background:'+rgba(s.color.hex||'#5464F2',s.color.opacity)+'"></span>'+
      (s.color.hex||'—')+'</span></div>').join('')+'</div>') +
    grp('Raw markdown values',
      '<div class="kv"><span class="k">color</span><span class="v">'+esc(row.color.raw||hex)+'</span></div>'+
      '<div class="kv"><span class="k">token</span><span class="v">'+esc(row.token||'—')+'</span></div>'+
      '<div class="kv"><span class="k">decoration</span><span class="v">'+esc(row.deco||'—')+'</span></div>') +
    grp('Generated CSS','<pre class="code">'+cssForLink(L,row)+'</pre>',
      '<button class="copy" id="copyLnk">Copy</button>') +
    grp('Do','<div class="doc do">'+li(numbered(doNode))+'</div>') +
    grp("Don't",'<div class="doc dont">'+li(numbered(dontNode))+'</div>') +
    (WARN.length ? grp('MD lint', WARN.map(w=>'<div class="callout plain"><span><b>'+w.raw+'</b> → '+w.fixed+' · '+w.why+'</span></div>').join('')) : '');

  const cp=$('copyLnk');
  if(cp) cp.onclick=()=>{
    const tmp=document.createElement('div'); tmp.innerHTML=cssForLink(L,row);
    navigator.clipboard.writeText(tmp.textContent);
    cp.textContent='Copied'; setTimeout(()=>cp.textContent='Copy',1200);
  };
}
function cssForLink(L,row){
  const cls='.lnk--'+L.id;
  const out=[]; const P=(k,v)=>out.push('  <span class="c-p">'+k+'</span>: <span class="c-v">'+v+'</span>;');
  out.push('<span class="c-s">/* '+L.name+' · generated from '+META.name+'.md '+META.version+' */</span>');
  out.push(cls+' {');
  P('font','500 14px/1 "Zoho Puvi", sans-serif');
  P('color', rgba(row.color.hex||'#5464F2', row.color.opacity));
  P('text-decoration', isUnderlined(row.deco) ? 'underline' : 'none');
  P('text-underline-offset','2px');
  P('cursor','pointer');
  out.push('}');
  L.states.filter(s=>norm(s.state)!==norm(row.state)).forEach(s=>{
    const st=norm(s.state);
    const sel = st==='hover'?':hover' : st==='click'||st==='pressed'?':active'
              : st==='focus'?':focus-visible' : st==='visited'?':visited' : '[data-state="'+st+'"]';
    out.push(cls+sel+' {');
    P('color', rgba(s.color.hex||'#5464F2', s.color.opacity));
    P('text-decoration', isUnderlined(s.deco) ? 'underline' : 'none');
    out.push('}');
  });
  return out.join('\n');
}

/* ---------- CSS generation ---------- */
function cssFor(vid,sid){
  const v=VARIANTS.find(x=>x.id===vid);
  const cls='.btn--'+vid;
  const base=computeStyle(vid,sid,'default',{chevron:S.chevron});
  const L=[]; const P=(k,val)=>L.push('  <span class="c-p">'+k+'</span>: <span class="c-v">'+val+'</span>;');
  L.push('<span class="c-s">/* '+v.name+' · '+base.size.name+' · generated from '+META.name+'.md '+META.version+' */</span>');
  L.push(cls+' {');
  P('display','inline-flex'); P('align-items','center'); P('justify-content','center');
  P('height',base.height+'px');
  P('padding',base.padT+'px '+base.padR+'px '+base.padB+'px '+base.padL+'px');
  P('gap',base.gap+'px'); P('border-radius',base.radius+'px');
  P('border',base.border.width?base.border.width+'px solid '+base.border.color:'none');
  P('background',base.fill.css);
  P('color',rgba(base.textColor,base.textAlpha));
  P('font',base.fontWeight+' '+base.font+'px/1 "'+base.fontFamily+'", sans-serif');
  P('cursor','pointer');
  L.push('}');
  [['hover',':hover'],['click',':active'],['disabled','[disabled]']].forEach(([st,sel])=>{
    const c=computeStyle(vid,sid,st,{chevron:S.chevron});
    L.push(cls+sel+' {');
    P('background',c.fill.css);
    if(c.border.width) P('border-color',rgba(c.border.color,c.border.opacity==null?1:c.border.opacity));
    if(c.textAlpha<1) P('color',rgba(c.textColor,c.textAlpha));
    if(c.containerOpacity<1) P('opacity',c.containerOpacity);
    L.push('}');
  });
  const ld=computeStyle(vid,sid,'loader',{});
  L.push(cls+'.is-loading {');
  P('background',ld.fill.css);
  if(ld.border.width) P('border-color',ld.border.color);
  P('color','transparent');
  L.push('}');
  L.push(cls+'.is-loading::after {');
  P('content','""'); P('position','absolute');
  P('width',ld.iconSize+'px'); P('height',ld.iconSize+'px');
  P('border','2px solid '+ld.spinner); P('border-top-color','transparent');
  P('border-radius','50%'); P('animation','spin .7s linear infinite');
  L.push('}');
  L.push(cls+':focus-visible {');
  P('outline',FOCUS.width+'px solid '+FOCUS.color); P('outline-offset',FOCUS.offset+'px');
  L.push('}');
  return L.join('\n');
}
function plainCSS(){ return cssFor(S.variant,S.size).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&'); }
function copyCSS(){
  navigator.clipboard.writeText(plainCSS()).then(()=>{
    const b=$('btnCopyCss'); const t=b.textContent; b.textContent='Copied'; setTimeout(()=>b.textContent=t,1200);
  });
}
function openSource(){ $('sheetPre').textContent=MD_SRC; $('sheetTitle').textContent=META.name+'.md'; $('modal').classList.add('on'); }

/* ---------- events ---------- */
$('tabs').querySelectorAll('button').forEach(t=>t.onclick=()=>{ S.tab=t.dataset.tab; renderAll(); });
$('bgSeg').querySelectorAll('button').forEach(t=>t.onclick=()=>{
  S.dark = t.dataset.bg==='dark';
  $('bgSeg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); renderCanvas();
});
$('btnCopyCss').onclick=copyCSS;
$('btnSource').onclick=openSource;
$('sheetClose').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{ if(e.target===$('modal')) $('modal').classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('modal').classList.remove('on'); });
$('findInput').oninput = e => { S.filter=e.target.value; renderNav(); };

function renderAll(){
  renderNav(); renderCrumbs(); renderModes(); renderCanvas();
  $('tabs').querySelectorAll('button').forEach(t=>t.classList.toggle('on',t.dataset.tab===S.tab));
  renderInspector();
}
renderAll();
console.log('[Component Studio] parsed', VARIANTS.length,'variants,',SIZES.length,'sizes,',LINKS.length,'link styles; warnings:',WARN);
</script>
